name: Phase3 Elementor Ownership UX Patch

on:
  push:
    branches: [fix/astra-full-reliability-ux-20260905]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/astra-full-reliability-ux-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Add explicit shared Elementor ownership error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/WordPressLiveRemediationControlV2.jsx')
          text = path.read_text()
          old = '''    const elementorState = inspectEditableElementor(kind, entity);
              if (elementorState.state === "invalid") throw ownershipUndetermined(kind, "_elementor_data è presente ma non è strutturato in modo valido e sicuro.");'''
          if old not in text:
              old = '''    const elementorState = inspectEditableElementor(kind, entity);
            if (elementorState.state === "invalid") throw ownershipUndetermined(kind, "_elementor_data è presente ma non è strutturato in modo valido e sicuro.");'''
          if old not in text:
              old = '''    const elementorState = inspectEditableElementor(kind, entity);
    if (elementorState.state === "invalid") throw ownershipUndetermined(kind, "_elementor_data è presente ma non è strutturato in modo valido e sicuro.");'''
          if old not in text:
              raise SystemExit('target Elementor state block not found')
          indent = old.split('if (elementorState.state')[0].split('\n')[-1]
          replacement = f'''    const elementorState = inspectEditableElementor(kind, entity);
{indent}if (elementorState.sharedReferences?.length) {{
{indent}  const references = elementorState.sharedReferences
{indent}    .map((item) => item.templateType || item.type || item.id)
{indent}    .filter(Boolean)
{indent}    .join(", ");
{indent}  throw ownershipUndetermined(kind, `Elementor usa template o widget condivisi (${{references || "riferimenti condivisi"}}): SeoGrow non può attribuire il markup pubblico a un solo widget locale. Il fallback su post_content è bloccato.`);
{indent}}}
{indent}if (elementorState.state === "invalid") throw ownershipUndetermined(kind, "_elementor_data è presente ma non è strutturato in modo valido e sicuro.");'''
          path.write_text(text.replace(old, replacement, 1))
          PY
      - name: Protect UX patch with source test
        run: |
          cat > src/elementorSharedOwnershipUx.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          const source = await readFile(new URL("./WordPressLiveRemediationControlV2.jsx", import.meta.url), "utf8");

          test("il live flow spiega e blocca ownership Elementor condivisa prima del piano automatico", () => {
            assert.match(source, /elementorState\.sharedReferences\?\.length/);
            assert.match(source, /template o widget condivisi/);
            assert.match(source, /Il fallback su post_content è bloccato/);
            assert.ok(source.indexOf("elementorState.sharedReferences?.length") < source.indexOf('elementorState.state === "invalid"'));
          });
          EOF
      - name: Verify
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/phase3-shared-ownership-message.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/WordPressLiveRemediationControlV2.jsx src/elementorSharedOwnershipUx.test.js .github/workflows/phase3-shared-ownership-message.yml
          git commit -m "fix: explain shared Elementor ownership blocks"
          git push origin HEAD:fix/astra-full-reliability-ux-20260905
