name: Sync release lockfile

on:
  push:
    paths:
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile metadata without package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit only the lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "seoGrow Release Gate"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "chore: sync package lock for 1.4.3"
          git push origin HEAD:main
