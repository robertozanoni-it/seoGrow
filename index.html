<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>seoGrow 0.2.0</title><style>:root{--bg:#f5f7f6;--surface:#fff;--text:#162019;--muted:#617066;--line:#dce4de;--green:#146c43;--dark:#102017;--danger:#a13232;--warning:#8a5a00;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,select,input{font:inherit}button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 12px;cursor:pointer}button:hover{border-color:#91a99b}.primary{background:var(--green);border-color:var(--green);color:#fff}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}header small{color:var(--muted);font-weight:500}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{background:var(--dark);padding:20px 12px}.brand{color:#fff;padding:0 10px 20px}.brand span{display:block;color:#aebbb2;font-size:12px}.nav{width:100%;text-align:left;border:0;background:transparent;color:#b7c4ba;margin:2px 0}.nav.active,.nav:hover{background:#1f3728;color:#fff;box-shadow:inset 3px 0 #5bd28e}main{padding:28px;max-width:1300px}.hero,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px}.hero{background:linear-gradient(135deg,#fff,#eef8f1)}h1{font-size:30px;line-height:1.15;margin:0 0 8px}h2{font-size:18px;margin:0 0 8px}.muted,small{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metrics div{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}.metrics b{display:block;font-size:28px}.metrics span{color:var(--muted)}.row{display:grid;grid-template-columns:minmax(0,1fr) 150px </style></head><body><div id="app"></div><script>window.SeoGrowModules = window.SeoGrowModules || {};
window.SeoGrowModules.contracts = {
  core: { id: 'core', version: '0.2.0', responsibility: 'Stato, eventi, routing, recovery e persistenza' },

    id: 'technical', version: '0.2.0', responsibility: 'Importa un elenco di link interni e rileva esclusivamente HTTP 404/410 confermati.',

</script><script>window.SeoGrow = window.SeoGrow || {};
SeoGrow.VERSION = '0.10.10'; SeoGrow.SCHEMA_VERSION = 4;
SeoGrow.FINDING_STATES = ['candidate','validated','insufficient_data','excluded','task_created','resolved','obsolete','reopened'];
SeoGrow.TASK_STATES = ['todo','pending_approval','approved','executing','completed','verification_pending','verified','failed','archived','obsolete'];
SeoGrow.TRANSITIONS = { finding:{candidate:['validated','insufficient_data','excluded'],validated:['task_created','resolved','obsolete'],task_created:['resolved','reopened'],resolved:['reopened'],obsolete:['reopened'],reopened:['validated','excluded']}, task:{todo:['pending_approval','approved','archived'],pending_approval:['approved','archived'],approved:['executing','archived'],executing:['completed','failed'],completed:['verification_pending'],verification_pending:['verified','failed'],failed:['approved','archived'],verified:['archived'],archived:[]} };
</script><script>window.SeoGrowUtils = window.SeoGrowUtils || {};
SeoGrowUtils.id = prefix => `${prefix}_${crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(36).slice(2)}`}`;
SeoGrowUtils.now = () => new Date().toISOString();
SeoGrowUtils.clone = value => JSON.parse(JSON.stringify(value));
SeoGrowUtils.escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
SeoGrowUtils.safeUrl = value => { try { const u = new URL(String(value), location.href); return ['http:','https:'].includes(u.protocol) ? u.href : ''; } catch { return ''; } };
SeoGrowUtils.signature = (...bits) => bits.map(x => String(x || '').trim().toLowerCase()).join('|');
</script><script>window.SeoGrowCore = window.SeoGrowCore || {};
SeoGrowCore.EventBus = class { constructor(){ this.events = new Map(); this.recent = []; }
  on(name, handler){ if(!this.events.has(name)) this.events.set(name,new Set()); this.events.get(name).add(handler); return () => this.off(name,handler); }
  once(name, handler){ const off=this.on(name,p=>{off();handler(p)}); return off; }
  off(name, handler){ this.events.get(name)?.delete(handler); }
  emit(name,payload={}){ this.recent.unshift({name,at:SeoGrowUtils.now(),payload}); this.recent=this.recent.slice(0,50); (this.events.get(name)||[]).forEach(fn=>{try{fn(payload)}catch(error){console.error('[seoGrow]',name,error)}}); }
};
</script><script>SeoGrowCore.Logger = class { constructor(){this.items=[]} log(level,module,action,context={}){this.items.unshift({level,module,action,context,at:SeoGrowUtils.now()});this.items=this.items.slice(0,200)} debug(m,a,c){this.log('debug',m,a,c)} info(m,a,c){this.log('info',m,a,c)} warn(m,a,c){this.log('warn',m,a,c)} error(m,a,c){this.log('error',m,a,c)} };
</script><script>SeoGrowCore.migrate = raw => { const state=SeoGrowUtils.clone(raw || {}); const version=Number(state.schemaVersion || 1); if(version < 2){ state.history=Array.isArray(state.history)?state.history:[]; state.datasets=Array.isArray(state.datasets)?state.datasets:[]; state.settings={autosave:true,...state.settings}; (state.findings||[]).forEach(f=>{f.description=f.description||f.summary||'';f.affectedItems=f.affectedItems||f.affected||[];f.signature=f.signature||SeoGrowUtils.signature(f.projectId,f.type,f.source,(f.affectedItems||[])[0]);}); } if(version < 3){ state.backupMeta={lastRestoreAt:null,lastBackupAt:null}; state.settings={autosave:true,storage:'indexeddb',...state.settings}; } state.schemaVersion=SeoGrow.SCHEMA_VERSION;state.appVersion=SeoGrow.VERSION; return state; };
</script><script>SeoGrowCore.Storage = class { constructor(key='seogrow:state'){this.key=key;this.dbName='seogrow';this.storeName='state'} async db(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB non disponibile'));const request=indexedDB.open(this.dbName,1);request.onupgradeneeded=()=>request.result.createObjectStore(this.storeName);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})} async load(){try{const db=await this.db();return await new Promise((resolve,reject)=>{const r=db.transaction(this.storeName,'readonly').objectStore(this.storeName).get(this.key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(error){const raw=localStorage.getItem(this.key);return raw?JSON.parse(raw):null}} async save(state){try{const db=await this.db();await new Promise((resolve,reject)=>{const r=db.transaction(this.storeName,'readwrite').objectStore(this.storeName).put(state,this.key);r.onsuccess=resolve;r.onerror=()=>reject(r.error)});localStorage.setItem(`${this.key}:meta`,JSON.stringify({schemaVersion:state.schemaVersion,updatedAt:SeoGrowUtils.now()}))}catch(error){localStorage.setItem(this.key,JSON.stringify(state));return 'fallback'}} backup(state){return JSON.stringify({appVersion:SeoGrow.VERSION,schemaVersion:SeoGrow.SCHEMA_VERSION,exportedAt:SeoGrowUtils.now(),...state},null,2)} validateBackup(text){let data;try{data=JSON.parse(text)}catch{throw new Error('Il backup non è JSON valido')}if(!data||!Array.isArray(data.projects)||!Array.isArray(data.findings)||!Array.isArray(data.tasks))throw new Error('Il backup non contiene una struttura seoGrow valida');if(Number(data.schemaVersion)>SeoGrow.SCHEMA_VERSION)throw new Error('Backup creato da una versione più recente');return SeoGrowCore.migrate(data)} };
</script><script>SeoGrowCore.Store = class { constructor(initial,bus,logger){this.state=SeoGrowUtils.clone(initial);this.bus=bus;this.logger=logger} getState(){return SeoGrowUtils.clone(this.state)} select(fn){return fn(this.state)} dispatch(action){const s=SeoGrowUtils.clone(this.state); const at=SeoGrowUtils.now(); switch(action.type){
case 'PROJECT_CREATED':s.projects.push(action.project);s.activeProjectId=action.project.id;break; case 'PROJECT_SELECTED':s.activeProjectId=action.id;break;
case 'CONNECTION_UPDATED':s.settings={...s.settings,connections:{...(s.settings.connections||{}),[action.connection]:action.value}};break;
case 'DATASET_IMPORTED':s.datasets.push(action.dataset);break; case 'FINDING_UPSERTED':{const i=s.findings.findIndex(x=>x.signature===action.finding.signature);if(i>-1)s.findings[i]={...s.findings[i],...action.finding,updatedAt:at};else s.findings.push(action.finding);break;}
case 'FINDING_STATUS':{const f=s.findings.find(x=>x.id===action.id);if(!f)throw new Error('Finding inesistente');this.transition('finding',f.status,action.status);f.status=action.status;f.updatedAt=at;break;}
case 'TASK_CREATED':s.tasks.push(action.task);break; case 'TASK_STATUS':{const t=s.tasks.find(x=>x.id===action.id);if(!t)throw new Error('Task inesistente');this.transition('task',t.status,action.status);t.status=action.status;t.updatedAt=at;break;} default:throw new Error(`Azione non supportata: ${action.type}`)}
s.history.push({id:SeoGrowUtils.id('history'),projectId:action.projectId||s.activeProjectId,entityType:action.entityType||action.type.split('_')[0].toLowerCase(),entityId:action.entityId||action.id||action.project?.id||action.dataset?.id||action.finding?.id||action.task?.id,action:action.type,timestamp:at,metadata:action.metadata||{}}); this.state=s;this.bus.emit('state:changed',{action,state:this.getState()});return this.getState() }
  transition(kind,from,to){if(!(SeoGrow.TRANSITIONS[kind][from]||[]).includes(to))throw new Error(`Transizione ${kind} non valida: ${from} → ${to}`)} replace(next,meta={}){this.state=SeoGrowUtils.clone(next);this.bus.emit('state:changed',{action:{type:'STATE_RESTORED',...meta},state:this.getState()});return this.getState()} };
</script><script>window.SeoGrowServices = window.SeoGrowServices || {};
SeoGrowServices.FindingService = class { constructor(store,bus){this.store=store;this.bus=bus} create(candidate){const now=SeoGrowUtils.now();const f={id:SeoGrowUtils.id('finding'),projectId:candidate.projectId,type:candidate.type,title:candidate.title,description:candidate.description||'',status:'candidate',severity:candidate.severity||'medium',impact:candidate.impact||'medium',confidence:Number(candidate.confidence||0),evidence:candidate.evidence||[],affectedItems:candidate.affectedItems||[],source:candidate.source||'UNKNOWN',signature:candidate.signature,createdAt:now,updatedAt:now};this.store.dispatch({type:'FINDING_UPSERTED',finding:f,projectId:f.projectId});this.bus.emit('finding:created',f);return f} status(id,status){const f=this.store.select(s=>s.findings.find(x=>x.id===id));this.store.dispatch({type:'FINDING_STATUS',id,status,projectId:f?.projectId,entityId:id});this.bus.emit(`finding:${status}`,{id});} };
</script><script>SeoGrowServices.TaskService = class { constructor(store,bus){this.store=store;this.bus=bus} create(findingId){const f=this.store.select(s=>s.findings.find(x=>x.id===findingId));if(!f)throw new Error('Finding inesistente');if(f.status!=='validated')throw new Error('Valida il finding prima di creare una task');const duplicate=this.store.select(s=>s.tasks.find(t=>t.findingId===findingId&&!['archived','obsolete'].includes(t.status)));if(duplicate)return duplicate;const task={id:SeoGrowUtils.id('task'),projectId:f.projectId,findingId,title:f.title,description:f.description,type:f.type,priority:f.severity==='high'?'Alta':f.severity==='low'?'Bassa':'Media',status:'todo',createdAt:SeoGrowUtils.now()};this.store.dispatch({type:'TASK_CREATED',task,projectId:f.projectId});this.store.dispatch({type:'FINDING_STATUS',id:f.id,status:'task_created',projectId:f.projectId});this.bus.emit('task:created',task);return task} status(id,status){const t=this.store.select(s=>s.tasks.find(x=>x.id===id));this.store.dispatch({type:'TASK_STATUS',id,status,projectId:t?.projectId,entityId:id});this.bus.emit(`task:${status}`,{id});} };
</script><script>window.SeoGrowTechnical = window.SeoGrowTechnical || {};
SeoGrowTechnical.parseLinks = text => { const cleaned=String(text||'').replace(/^\uFEFF/,'').trim(); if(!cleaned) return []; if(cleaned.startsWith('[')){const data=JSON.parse(cleaned);if(!Array.isArray(data))throw new Error('Il JSON deve contenere un array');return data.map(x=>({source:String(x.source||'').trim(),target:String(x.target||'').trim(),status:Number(x.status)}));} const lines=cleaned.split(/\r?\n/).filter(Boolean);const separator=lines[0].includes(';')?';':',';const headers=lines.shift().split(separator).map(x=>x.trim().toLowerCase());const at=n=>headers.indexOf(n);if([at('source'),at('target'),at('status')].some(i=>i<0))throw new Error('CSV non valido: servono le colonne source, target, status');return lines.map(line=>{const c=line.split(separator).map(x=>x.trim().replace(/^"|"$/g,''));return {source:c[at('source')],target:c[at('target')],status:Number(c[at('status')])};}); };
SeoGrowTechnical.validateLinks = records => {const valid=[],invalid=[];records.forEach((r,index)=>{if(!SeoGrowUtils.safeUrl(r.source)||!SeoGrowUtils.safeUrl(r.target)||!Number.isInteger(r.status))invalid.push({index:index+1,reason:'URL o stato HTTP non valido'});else valid.push({...r,source:SeoGrowUtils.safeUrl(r.source),target:SeoGrowUtils.safeUrl(r.target)});});return {valid,invalid};};
SeoGrowTechnical.analyzeBrokenLinks = (projectId, records) => records.filter(r=>[404,410].includes(r.status)).map(r=>({projectId,type:'broken_internal_link',title:'Link interno rotto confermato',description:`${r.source} punta a ${r.target} e restituisce HTTP ${r.status}.`,severity:'high',impact:'high',confidence:100,source:'IMPORTED',affectedItems:[r.source,r.target],evidence:[{type:'http_status',source:'IMPORTED',value:r.status,reliability:'CONFIRMED',timestamp:SeoGrowUtils.now(),note:`Origine: ${r.source}`}],signature:SeoGrowUtils.signature(projectId,'broken_internal_link',r.source,r.target,r.status)}));
</script><script>window.SeoGrowSearchConsole = window.SeoGrowSearchConsole || {};
SeoGrowSearchConsole.parse = text => {const lines=String(text||'').replace(/^\uFEFF/,'').trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)throw new Error('Il CSV Search Console non contiene record');const sep=lines[0].includes(';')?';':',';const header=lines.shift().split(sep).map(x=>x.trim().toLowerCase());const index=(...names)=>header.findIndex(x=>names.includes(x));const q=index('query','query principale'),url=index('page','pagina','url'),clicks=index('clicks','clic'),impressions=index('impressions','impressioni'),position=index('position','posizione');if([q,url,clicks,impressions,position].some(x=>x<0))throw new Error('CSV non supportato: servono Query, Page, Clicks, Impressions e Position');return lines.map(line=>{const c=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));return {query:c[q],url:c[url],clicks:Number(c[clicks]),impressions:Number(c[impressions]),position:Number(String(c[position]).replace(',','.'))}}).filter(r=>r.query&&SeoGrowUtils.safeUrl(r.url)&&Number.isFinite(r.impressions));};
SeoGrowSearchConsole.cannibalization = (projectId,rows) => {const byQuery=new Map();rows.forEach(r=>{const k=r.query.toLowerCase().trim();if(!byQuery.has(k))byQuery.set(k,[]);byQuery.get(k).push({...r,url:SeoGrowUtils.safeUrl(r.url)})});return [...byQuery].flatMap(([query,list])=>{const pages=[...new Map(list.map(r=>[r.url,r])).values()].sort((a,b)=>b.impressions-a.impressions||a.url.localeCompare(b.url));const total=pages.reduce((n,r)=>n+r.impressions,0);if(pages.length<2||total<20||pages[1].impressions<5||pages[1].impressions/total<.12)return [];return [{projectId,type:'cannibalization',title:`Possibile cannibalizzazione: ${query}`,description:`${pages.length} URL hanno ricevuto impressioni per la stessa query. Verifica l'intento prima di intervenire.`,severity:'medium',impact:'medium',confidence:85,source:'IMPORTED',affectedItems:pages.map(x=>x.url),evidence:pages.map(x=>({type:'gsc_page_query',source:'IMPORTED',value:{url:x.url,impressions:x.impressions,clicks:x.clicks,position:x.position},reliability:'HIGH',timestamp:SeoGrowUtils.now()})),signature:SeoGrowUtils.signature(projectId,'cannibalization',query,pages.map(x=>x.url).join(','))}]});};
</script><script>window.SeoGrowSearchConsoleBundle=window.SeoGrowSearchConsoleBundle||{};
SeoGrowSearchConsoleBundle.header=function(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()};
SeoGrowSearchConsoleBundle.row=function(line,sep){var out=[],value='',quoted=false;for(var i=0;i<line.length;i++){var char=line[i];if(char==='"'){if(quoted&&line[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(char===sep&&!quoted){out.push(value.trim());value=''}else value+=char}out.push(value.trim());return out};
SeoGrowSearchConsoleBundle.csv=function(text){var lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(x){return x.trim()!==''});if(!lines.length)return {headers:[],rows:[]};var sep=lines[0].indexOf(';')>-1?';':',';var headers=SeoGrowSearchConsoleBundle.row(lines.shift(),sep).map(function(x){return x.trim()});return {headers:headers,rows:lines.map(function(line){var c=SeoGrowSearchConsoleBundle.row(line,sep),row={};headers.forEach(function(h,i){row[h]=String(c[i]||'').trim()});return row})};};
SeoGrowSearchConsoleBundle.kind=function(headers){var h=headers.map(SeoGrowSearchConsoleBundle.header).join('|');if(h.indexOf('query')>-1)return 'queries';if(h.indexOf('pagine principali')>-1||h.indexOf('pagine')>-1||h.indexOf('top pages')>-1||h.indexOf('page')>-1||h.indexOf('pages')>-1||h.indexOf('url')>-1)return 'pages';if(h.indexOf('paese')>-1||h.indexOf('country')>-1)return 'countries';if(h.indexOf('dispositivo')>-1||h.indexOf('device')>-1)return 'devices';if(h.indexOf('aspetto nella ricerca')>-1||h.indexOf('search appearance')>-1)return 'searchAppearance';if(h.indexOf('filtra')>-1||h.indexOf('filter')>-1)return 'filters';if(h.indexOf('data')>-1||h.indexOf('date')>-1)return 'chart';return 'unknown'};

/* Crawl link interni: registra anche gli esiti senza errori 404/410. */
(function(){
  var proto=SeoGrowUI.App.prototype;
  var previousFindings=proto.findings;
  var previousSettings=proto.settings;

  SeoGrowTechnical.isExplicitEmptyAudit=function(text){
    var cleaned=String(text||'').replace(/^\uFEFF/,'').trim();
    if(!cleaned)return false;
    if(cleaned.charAt(0)==='['){
      try{var json=JSON.parse(cleaned);return Array.isArray(json)&&json.length===0;}catch(error){return false;}
    }
    var lines=cleaned.split(/\r?\n/).filter(function(line){return line.trim()!=='';});
    if(lines.length!==1)return false;
    var separator=lines[0].indexOf(';')>-1?';':',';
    var headers=lines[0].split(separator).map(function(header){return header.trim().toLowerCase();});
    return ['source','target','status'].every(function(name){return headers.indexOf(name)>-1;});
  };

  proto.importLinks=async function(){
    var file=document.getElementById('linkFile')&&document.getElementById('linkFile').files[0];
    if(!file)throw Error('Seleziona un CSV o JSON');

    var text=await file.text();
    var records=SeoGrowTechnical.parseLinks(text);
    var result=SeoGrowTechnical.validateLinks(records);
    var emptyAudit=SeoGrowTechnical.isExplicitEmptyAudit(text);
    if(!result.valid.length&&!emptyAudit){
      throw Error(result.invalid.length?'Nessun record link valido: controlla URL e codici HTTP.':'Il file non contiene un crawl valido. Per registrare un controllo senza errori usa il CSV con le sole intestazioni source,target,status oppure un JSON [].');
    }

    var project=this.app.store.select(function(state){return state.activeProjectId;});
    var findings=SeoGrowTechnical.analyzeBrokenLinks(project,result.valid);
    var auditStatus=findings.length?'broken_links_found':'no_broken_links';
    var source=/\.json$/i.test(file.name)?'JSON':'CSV';
    this.app.store.dispatch({type:'DATASET_IMPORTED',dataset:{
      id:SeoGrowUtils.id('dataset'),
      projectId:project,
      type:'internal-links',
      source:source,
      importedAt:SeoGrowUtils.now(),
      records:result.valid.length,
      invalid:result.invalid.length,
      data:result.valid,
      provenance:{
        fileName:file.name,
        auditStatus:auditStatus,
        checkedLinks:result.valid.length,
        confirmedBrokenLinks:findings.length,
        emptyAudit:emptyAudit,
        auditedAt:SeoGrowUtils.now()
      }
    }});
    findings.forEach(this.app.findings.create.bind(this.app.findings));

    if(auditStatus==='no_broken_links'){
      var checked=result.valid.length?' su '+result.valid.length+' link importati':'';
      var ignored=result.invalid.length?' '+result.invalid.length+' righe non valide ignorate.':'';
      this.notify('Crawl registrato: nessun link interno rotto (HTTP 404/410) trovato'+checked+'.'+ignored);
      return;
    }
    this.notify('Crawl registrato: '+findings.length+' link interni rotti confermati. '+result.invalid.length+' righe non valide ignorate.');
  };

  proto.technical=function(){
    return '<h1>Verifica link interni</h1><p class="muted">Importa CSV/JSON con <code>source,target,status</code>. Vengono creati riscontri solo per HTTP 404/410 confermati.</p><section class="card"><label for="linkFile">File CSV o JSON</label><input id="linkFile" type="file" accept=".csv,.json,application/json,text/csv"><p><small>Se il crawl non trova errori, puoi importare un CSV con le sole intestazioni <code>source,target,status</code> oppure un JSON <code>[]</code>: seoGrow registrerà il controllo come completato.</small></p><button class="primary" data-action="import-links">Importa e analizza</button></section>';
  };

  proto.findings=function(){
    var state=this.state();
    var project=state.activeProjectId;
    var rows=state.findings.filter(function(finding){return finding.projectId===project;});
    var latestAudit=state.datasets.filter(function(dataset){return dataset.projectId===project&&dataset.type==='internal-links';}).slice(-1)[0];
    if(!rows.length&&latestAudit&&latestAudit.provenance&&latestAudit.provenance.auditStatus==='no_broken_links'){
      var links=Number(latestAudit.provenance.checkedLinks||0);
      return '<h1>Riscontri</h1><section class="card"><div class="empty"><b>Nessun link rotto trovato.</b><p>Il crawl di link interni del '+new Date(latestAudit.importedAt).toLocaleString('it-IT')+(links?' ha controllato '+links+' link importati':' non contiene link con HTTP 404/410')+'.</p></div></section>';
    }
    return previousFindings.call(this);
  };

  proto.settings=function(){
    var base=previousSettings.call(this);
    var state=this.state();
    var project=state.activeProjectId;
    var audit=state.datasets.filter(function(dataset){return dataset.projectId===project&&dataset.type==='internal-links';}).slice(-1)[0];
    if(!audit||!audit.provenance||!audit.provenance.auditStatus)return base;

    var provenance=audit.provenance;
    var passed=provenance.auditStatus==='no_broken_links';
    var title=passed?'Nessun link rotto trovato':'Link rotti confermati';
    var detail=passed?'Crawl completato senza errori HTTP 404/410.':'Sono stati rilevati '+Number(provenance.confirmedBrokenLinks||0)+' link interni rotti con HTTP 404/410.';
    var checked=Number(provenance.checkedLinks||0);
    var checkedLabel=checked?checked+' link importati':'Crawl senza righe di dettaglio';
    return base+'<section class="card"><h2>Ultimo crawl link interni</h2><p class="status '+(passed?'verified':'candidate')+'">'+title+'</p><p>'+detail+'</p><p class="muted">'+checkedLabel+' · '+new Date(audit.importedAt).toLocaleString('it-IT')+'</p></section>';
  };
})();

      active.superseded = true;

        try { active.controller.abort(); } catch (error) {}
      }
    }

          projectId: projectId,
          type: 'pages-onpage',
          source: 'WORDPRESS_CONNECTOR',
          importedAt: SeoGrowUtils.now(),

          invalid: 0,
          data: all,
          provenance: {pagesFetched: page, site: connection.base}

      updatedAt: now
    };
    this.store.dispatch({type: 'FINDING_UPSERTED', finding: finding, projectId: finding.projectId});
    var saved = this.store.select(function (state) {
      return state.findings.find(function (item) { return item.id === finding.id; });
    }) || finding;
    this.bus.emit(existing ? 'finding:updated' : 'finding:created', saved);
    return saved;
  };

  var proto = SeoGrowUI.App.prototype;
  var legacyClick = proto.click;

  function inputValue(id) {
    var input = document.getElementById(id);
    return input ? input.value : '';
  }

  function formCredentials(app) {
    var values = {
      site: inputValue('wpSite') || app.pendingWordPress().site,
      token: inputValue('wpToken'),
      username: inputValue('wpUsername') || app.pendingWordPress().username,
      password: inputValue('wpPassword')
    };
    return hasCredentials(values) ? values : {site: values.site};
  }

  function connectionStatus(app, state) {
    if (app.wordpress) {
      return '<p class="status verified">WordPress attivo in questa sessione: ' + SeoGrowUtils.escapeHTML(app.wordpress.base) + '</p>';
    }
    var saved = state.settings && state.settings.connections && state.settings.connections.wordpress;
    if (saved && saved.base) {
      var when = saved.lastVerifiedAt ? ' Ultima verifica: ' + new Date(saved.lastVerifiedAt).toLocaleString('it-IT') + '.' : '';
      return '<p class="status candidate">Nessuna sessione WordPress attiva.' + when + ' Ricollega il sito per importare nuovi dati.</p>';
    }
    return '<p><small>La chiave e la Password applicazione non vengono salvate nel backup.</small></p>';
  }

  proto.pages = function () {
    var state = this.state();
    var project = state.activeProjectId;
    var datasets = state.datasets.filter(function (dataset) { return dataset.projectId === project; });
    var latest = function (type) {
      var list = datasets.filter(function (dataset) { return dataset.type === type; });
      return list.length ? list[list.length - 1] : null;
    };
    var gsc = latest('search-console-pages');
    var pages = latest('pages-onpage');
    var draft = this.app.pendingWordPress();
    var saved = state.settings && state.settings.connections && state.settings.connections.wordpress;
    var defaultSite = draft.site || (this.app.wordpress && this.app.wordpress.base) || (saved && saved.base) || '';
    var imports = (gsc ? '<p class="status verified">Search Console · Pagine: ' + gsc.records + ' URL salvati.</p>' : '') + (pages ? '<p class="status verified">On-page: ' + pages.records + ' URL salvati.</p>' : '');
    var localWarning = fileOrigin() ? '<div class="notice error">Stai usando seoGrow come file locale. Per collegare WordPress apri l’app da HTTPS o localhost: file:// usa un’origine null e viene normalmente bloccata dal CORS.</div>' : '';
    var action = this.app.wordpress ? 'Verifica/aggiorna e importa da WordPress' : 'Collega e importa da WordPress';
    var disconnect = this.app.wordpress ? '<button data-action="wp-disconnect">Disconnetti</button>' : '';
    return '<h1>Pagine e on-page</h1><p class="muted">Collega WordPress con un solo flusso controllato, oppure importa un crawl on-page. La connessione rimane attiva solo nella sessione corrente.</p>' +
      localWarning +
      '<section class="card"><h2>Importazione automatica WordPress</h2>' + connectionStatus(this.app, state) +
      '<label for="wpSite">URL del sito WordPress</label><input id="wpSite" type="url" placeholder="https://tuosito.it" value="' + SeoGrowUtils.escapeHTML(defaultSite) + '">' +
      '<label for="wpToken">Chiave seoGrow</label><input id="wpToken" type="password" autocomplete="off"><p><small>Metodo consigliato. L’header X-SeoGrow-Token richiede che il connettore autorizzi il CORS.</small></p>' +
      '<details><summary>Usa invece Password applicazione WordPress</summary><label for="wpUsername">Utente WordPress</label><input id="wpUsername" autocomplete="username" value="' + SeoGrowUtils.escapeHTML(draft.username) + '">' +
      '<label for="wpPassword">Password applicazione WordPress</label><input id="wpPassword" type="password" autocomplete="off"></details>' +
      '<div class="actions"><button class="primary" data-action="wp-connect-import">' + action + '</button>' + disconnect + '</div></section>' +
      '<section class="card"><h2>Importazione CSV</h2>' + imports +
      '<label for="pagesFile">CSV pagine</label><input id="pagesFile" type="file" accept=".csv,text/csv"><p><small>Crawl on-page: URL, Title, Meta Description, H1, Canonical, Indexability. Search Console: Pagine principali, Clic, Impressioni, CTR, Posizione.</small></p><button data-action="import-pages">Importa e verifica</button></section>';
  };

  proto.technical = function () {
    return '<h1>Verifica link interni</h1><p class="muted">Importa un crawl con <code>source,target,status</code>. Vengono creati riscontri solo per HTTP 404/410 confermati.</p>' +
      '<section class="card"><h2>Nuova analisi</h2><p>Avvia un nuovo controllo scegliendo un export aggiornato del crawler. Lo storico resta conservato: i riscontri già lavorati non vengono cancellati né duplicati.</p>' +
      '<div class="actions"><button class="primary" data-action="new-link-analysis">Nuova analisi</button><button data-action="download-link-template">Scarica modello CSV</button></div>' +
      '<p><small>Il file deve avere le colonne <code>source,target,status</code>. Se non trovi errori, importa il solo header oppure un JSON <code>[]</code>.</small></p></section>' +
      '<section class="card"><h2>Importa il crawl</h2><label for="linkFile">File CSV o JSON</label><input id="linkFile" type="file" accept=".csv,.json,application/json,text/csv">' +
      '<p><small>Da Screaming Frog o altro crawler: una riga per ogni link interno, con URL origine, URL destinazione e codice HTTP effettivo.</small></p><button class="primary" data-action="import-links">Importa e analizza</button></section>';
  };

  proto.competitors = function () {
    var connected = Boolean(this.app.wordpress);
    var connection = connected ? '<p class="status verified">WordPress attivo: ' + SeoGrowUtils.escapeHTML(this.app.wordpress.base) + '</p>' : '<p class="muted">Collega prima WordPress nella sezione Pagine e on-page; non verranno richieste credenziali nei popup del browser.</p>';
    var automatic = connected ? '<button class="primary" data-action="dataforseo-import-competitors">Aggiorna competitor con DataForSEO</button>' : '<button class="primary" data-action="wp-open-connection">Collega WordPress</button>';
    return '<h1>Competitor e keyword gap</h1><p class="muted">Scegli l’aggiornamento automatico per avere competitor organici reali, oppure importa un CSV per il keyword gap.</p><section class="card"><h2>Competitor automatici con DataForSEO</h2>' +
      connection + '<p>Il connettore WordPress esegue la richiesta con le credenziali configurate sul sito. seoGrow non riceve né salva la chiave DataForSEO.</p><p><small>Una chiamata Live può consumare credito DataForSEO.</small></p>' + automatic +
      '</section><section class="card"><h2>Keyword gap da CSV</h2><label for="competitorFile">CSV posizionamenti</label><input id="competitorFile" type="file" accept=".csv,text/csv"><p><small>Colonne richieste: Keyword, Domain, Position. Opzionale: URL.</small></p><button data-action="import-competitors">Importa e confronta</button></section>';
  };

  proto.click = async function (event) {
    var element = event.target.closest('[data-action],[data-view]');
    if (!element) return;
    var action = element.dataset.action;
    if (element.dataset.view) {
      this.message = '';
      this.view = element.dataset.view;
      this.render();
      return;
    }
    if (action === 'new-link-analysis') {
      this.message = '';
      this.view = 'technical';
      this.render();
      var linkInput = document.getElementById('linkFile');
      if (linkInput && !linkInput.disabled) linkInput.click();
      return;
    }
    if (action === 'download-link-template') {
      var template = 'source,target,status\nhttps://www.sito.it/pagina-origine/,https://www.sito.it/pagina-rimossa/,404\n';
      var anchor = document.createElement('a');
      anchor.href = URL.createObjectURL(new Blob([template], {type: 'text/csv;charset=utf-8'}));
      anchor.download = 'seogrow-link-interni-modello.csv';
      anchor.click();
      URL.revokeObjectURL(anchor.href);
      this.notify('Modello CSV scaricato. Sostituisci la riga di esempio con l’export reale del crawl.');
      return;
    }
    if (action === 'wp-open-connection' || action === 'wp-import-pages') {
      this.view = 'pages';
      this.notify('Inserisci l’URL e una chiave seoGrow o una Password applicazione per collegare WordPress.');
      return;
    }
    if (action === 'wp-disconnect') {
      this.app.disconnectWordPress();
      this.notify('Connessione WordPress chiusa. Nessuna chiave è stata salvata.');
      return;
    }
    if (action === 'wp-connect-import') {
      if (element.disabled) return;
      element.disabled = true;
      element.textContent = 'Connessione in corso…';
      try {
        var credentials = formCredentials(this.app);
        var imported = await this.app.importWordPressPages(credentials);
        this.app.rememberWordPress({site: this.app.wordpress && this.app.wordpress.base, username: credentials.username});
        var tokenInput = document.getElementById('wpToken');
        var passwordInput = document.getElementById('wpPassword');
        if (tokenInput) tokenInput.value = '';
        if (passwordInput) passwordInput.value = '';
        this.notify('Importate e salvate ' + imported.records + ' pagine da WordPress. I riscontri sono pronti per la revisione.');
      } catch (error) {
        if (!isSuperseded(error)) this.notify(error.message, 'error');
      } finally {
        if (element.isConnected) {
          element.disabled = false;
          element.textContent = 'Collega e importa da WordPress';
        }
      }
      return;
    }
    if (action === 'dataforseo-import-competitors') {
      if (element.disabled) return;
      element.disabled = true;
      try {
        var result = await this.app.importDataForSeoCompetitors();
        if (!result.cancelled) {
          var cost = result.cost === null || typeof result.cost === 'undefined' ? '' : ' Costo riportato: $' + Number(result.cost).toFixed(4) + '.';
          this.notify('Competitor aggiornati automaticamente: ' + result.records + ' domini salvati nel progetto.' + cost);
        }
      } catch (error) {
        if (error && error.code === 'WP_CONNECTION_REQUIRED') this.view = 'pages';
        if (!isSuperseded(error)) this.notify(error.message, 'error');
      } finally {
        if (element.isConnected) element.disabled = false;
      }
      return;
    }
    return legacyClick.call(this, event);
  };
})();
</script></body></html>
