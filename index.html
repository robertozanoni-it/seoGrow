<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>seoGrow 0.2.0</title><style>:root{--bg:#f5f7f6;--surface:#fff;--text:#162019;--muted:#617066;--line:#dce4de;--green:#146c43;--dark:#102017;--danger:#a13232;--warning:#8a5a00;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,select,input{font:inherit}button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 12px;cursor:pointer}button:hover{border-color:#91a99b}.primary{background:var(--green);border-color:var(--green);color:#fff}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}header small{color:var(--muted);font-weight:500}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{background:var(--dark);padding:20px 12px}.brand{color:#fff;padding:0 10px 20px}.brand span{display:block;color:#aebbb2;font-size:12px}.nav{width:100%;text-align:left;border:0;background:transparent;color:#b7c4ba;margin:2px 0}.nav.active,.nav:hover{background:#1f3728;color:#fff;box-shadow:inset 3px 0 #5bd28e}main{padding:28px;max-width:1300px}.hero,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px}.hero{background:linear-gradient(135deg,#fff,#eef8f1)}h1{font-size:30px;line-height:1.15;margin:0 0 8px}h2{font-size:18px;margin:0 0 8px}.muted,small{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metrics div{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}.metrics b{display:block;font-size:28px}.metrics span{color:var(--muted)}.row{display:grid;grid-template-columns:minmax(0,1fr) 150px 180px;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:15px 0}.row:last-child{border-bottom:0}.row p{margin:4px 0}.status{font-size:12px;font-weight:700;text-transform:capitalize;padding:5px 8px;border-radius:99px;background:#eef0ef;display:inline-block}.status.candidate,.status.todo,.status.pending_approval,.status.verification_pending{background:#fff2d8;color:var(--warning)}.status.validated,.status.approved,.status.executing,.status.completed,.status.verified,.status.resolved,.status.task_created{background:#e6f5eb;color:var(--green)}.status.excluded,.status.obsolete,.status.archived{background:#f2eded;color:#795252}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:22px;background:#f7faf8;border-radius:10px;color:var(--muted)}.notice{margin-bottom:16px;border-radius:10px;padding:11px 14px;background:#e6f5eb;color:var(--green);border:1px solid #c5e4d0}.notice.error{background:#fbeeee;color:var(--danger);border-color:#efcccc}label{font-weight:700;display:block;margin-bottom:8px}input[type=file]{display:block;max-width:100%;margin-bottom:14px}@media(max-width:850px){header{padding:0 12px}.shell{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:10px;gap:4px}.brand{display:none}.nav{width:auto;white-space:nowrap}.metrics{grid-template-columns:1fr 1fr}main{padding:16px}.row{grid-template-columns:1fr;gap:8px}}@media(max-width:420px){.metrics{grid-template-columns:1fr}h1{font-size:26px}}
</style></head><body><div id="app"></div><script>window.SeoGrowModules = window.SeoGrowModules || {};
window.SeoGrowModules.contracts = {
  core: { id: 'core', version: '0.2.0', responsibility: 'Stato, eventi, routing, recovery e persistenza' },
  technical: {
    id: 'technical', version: '0.2.0', responsibility: 'Importa un elenco di link interni e rileva esclusivamente HTTP 404/410 confermati.',
    inputs: ['CSV/JSON normalizzato: source,target,status'], outputs: ['FindingCandidate[]'],
    dependencies: ['findingService'], stateTransitions: ['candidate → validated → task_created → resolved']
  }
};
</script><script>window.SeoGrow = window.SeoGrow || {};
SeoGrow.VERSION = '0.2.0'; SeoGrow.SCHEMA_VERSION = 2;
SeoGrow.FINDING_STATES = ['candidate','validated','insufficient_data','excluded','task_created','resolved','obsolete','reopened'];
SeoGrow.TASK_STATES = ['todo','pending_approval','approved','executing','completed','verification_pending','verified','failed','archived','obsolete'];
SeoGrow.TRANSITIONS = { finding:{candidate:['validated','insufficient_data','excluded'],validated:['task_created','resolved','obsolete'],task_created:['resolved','reopened'],resolved:['reopened'],obsolete:['reopened'],reopened:['validated','excluded']}, task:{todo:['pending_approval','approved','archived'],pending_approval:['approved','archived'],approved:['executing','archived'],executing:['completed','failed'],completed:['verification_pending'],verification_pending:['verified','failed'],failed:['approved','archived'],verified:['archived'],archived:[]} };
</script><script>window.SeoGrowUtils = window.SeoGrowUtils || {};
SeoGrowUtils.id = prefix => `${prefix}_${crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(36).slice(2)}`}`;
SeoGrowUtils.now = () => new Date().toISOString();
SeoGrowUtils.clone = value => JSON.parse(JSON.stringify(value));
SeoGrowUtils.escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
SeoGrowUtils.safeUrl = value => { try { const u = new URL(String(value), location.href); return ['http:','https:'].includes(u.protocol) ? u.href : ''; } catch { return ''; } };
SeoGrowUtils.signature = (...bits) => bits.map(x => String(x || '').trim().toLowerCase()).join('|');
</script><script>window.SeoGrowCore = window.SeoGrowCore || {};
SeoGrowCore.EventBus = class { constructor(){ this.events = new Map(); this.recent = []; }
  on(name, handler){ if(!this.events.has(name)) this.events.set(name,new Set()); this.events.get(name).add(handler); return () => this.off(name,handler); }
  once(name, handler){ const off=this.on(name,p=>{off();handler(p)}); return off; }
  off(name, handler){ this.events.get(name)?.delete(handler); }
  emit(name,payload={}){ this.recent.unshift({name,at:SeoGrowUtils.now(),payload}); this.recent=this.recent.slice(0,50); (this.events.get(name)||[]).forEach(fn=>{try{fn(payload)}catch(error){console.error('[seoGrow]',name,error)}}); }
};
</script><script>SeoGrowCore.Logger = class { constructor(){this.items=[]} log(level,module,action,context={}){this.items.unshift({level,module,action,context,at:SeoGrowUtils.now()});this.items=this.items.slice(0,200)} debug(m,a,c){this.log('debug',m,a,c)} info(m,a,c){this.log('info',m,a,c)} warn(m,a,c){this.log('warn',m,a,c)} error(m,a,c){this.log('error',m,a,c)} };
</script><script>SeoGrowCore.migrate = raw => { const state=SeoGrowUtils.clone(raw || {}); const version=Number(state.schemaVersion || 1); if(version < 2){ state.history=Array.isArray(state.history)?state.history:[]; state.datasets=Array.isArray(state.datasets)?state.datasets:[]; state.settings={autosave:true,...state.settings}; (state.findings||[]).forEach(f=>{f.description=f.description||f.summary||'';f.affectedItems=f.affectedItems||f.affected||[];f.signature=f.signature||SeoGrowUtils.signature(f.projectId,f.type,f.source,(f.affectedItems||[])[0]);}); state.schemaVersion=2; } return state; };
</script><script>SeoGrowCore.Storage = class { constructor(key='seogrow:state'){this.key=key} load(){const raw=localStorage.getItem(this.key);return raw?JSON.parse(raw):null} save(state){localStorage.setItem(this.key,JSON.stringify(state))} backup(state){return JSON.stringify({appVersion:SeoGrow.VERSION,schemaVersion:SeoGrow.SCHEMA_VERSION,exportedAt:SeoGrowUtils.now(),...state},null,2)} };
</script><script>SeoGrowCore.Store = class { constructor(initial,bus,logger){this.state=SeoGrowUtils.clone(initial);this.bus=bus;this.logger=logger} getState(){return SeoGrowUtils.clone(this.state)} select(fn){return fn(this.state)} dispatch(action){const s=SeoGrowUtils.clone(this.state); const at=SeoGrowUtils.now(); switch(action.type){
case 'PROJECT_CREATED':s.projects.push(action.project);s.activeProjectId=action.project.id;break; case 'PROJECT_SELECTED':s.activeProjectId=action.id;break;
case 'DATASET_IMPORTED':s.datasets.push(action.dataset);break; case 'FINDING_UPSERTED':{const i=s.findings.findIndex(x=>x.signature===action.finding.signature);if(i>-1)s.findings[i]={...s.findings[i],...action.finding,updatedAt:at};else s.findings.push(action.finding);break;}
case 'FINDING_STATUS':{const f=s.findings.find(x=>x.id===action.id);if(!f)throw new Error('Finding inesistente');this.transition('finding',f.status,action.status);f.status=action.status;f.updatedAt=at;break;}
case 'TASK_CREATED':s.tasks.push(action.task);break; case 'TASK_STATUS':{const t=s.tasks.find(x=>x.id===action.id);if(!t)throw new Error('Task inesistente');this.transition('task',t.status,action.status);t.status=action.status;t.updatedAt=at;break;} default:throw new Error(`Azione non supportata: ${action.type}`)}
s.history.push({id:SeoGrowUtils.id('history'),projectId:action.projectId||s.activeProjectId,entityType:action.entityType||action.type.split('_')[0].toLowerCase(),entityId:action.entityId||action.id||action.project?.id||action.dataset?.id||action.finding?.id||action.task?.id,action:action.type,timestamp:at,metadata:action.metadata||{}}); this.state=s;this.bus.emit('state:changed',{action,state:this.getState()});return this.getState() }
transition(kind,from,to){if(!(SeoGrow.TRANSITIONS[kind][from]||[]).includes(to))throw new Error(`Transizione ${kind} non valida: ${from} → ${to}`)} };
</script><script>window.SeoGrowServices = window.SeoGrowServices || {};
SeoGrowServices.FindingService = class { constructor(store,bus){this.store=store;this.bus=bus} create(candidate){const now=SeoGrowUtils.now();const f={id:SeoGrowUtils.id('finding'),projectId:candidate.projectId,type:candidate.type,title:candidate.title,description:candidate.description||'',status:'candidate',severity:candidate.severity||'medium',impact:candidate.impact||'medium',confidence:Number(candidate.confidence||0),evidence:candidate.evidence||[],affectedItems:candidate.affectedItems||[],source:candidate.source||'UNKNOWN',signature:candidate.signature,createdAt:now,updatedAt:now};this.store.dispatch({type:'FINDING_UPSERTED',finding:f,projectId:f.projectId});this.bus.emit('finding:created',f);return f} status(id,status){const f=this.store.select(s=>s.findings.find(x=>x.id===id));this.store.dispatch({type:'FINDING_STATUS',id,status,projectId:f?.projectId,entityId:id});this.bus.emit(`finding:${status}`,{id});} };
</script><script>SeoGrowServices.TaskService = class { constructor(store,bus){this.store=store;this.bus=bus} create(findingId){const f=this.store.select(s=>s.findings.find(x=>x.id===findingId));if(!f)throw new Error('Finding inesistente');if(f.status!=='validated')throw new Error('Valida il finding prima di creare una task');const duplicate=this.store.select(s=>s.tasks.find(t=>t.findingId===findingId&&!['archived','obsolete'].includes(t.status)));if(duplicate)return duplicate;const task={id:SeoGrowUtils.id('task'),projectId:f.projectId,findingId,title:f.title,description:f.description,type:f.type,priority:f.severity==='high'?'Alta':f.severity==='low'?'Bassa':'Media',status:'todo',createdAt:SeoGrowUtils.now()};this.store.dispatch({type:'TASK_CREATED',task,projectId:f.projectId});this.store.dispatch({type:'FINDING_STATUS',id:f.id,status:'task_created',projectId:f.projectId});this.bus.emit('task:created',task);return task} status(id,status){const t=this.store.select(s=>s.tasks.find(x=>x.id===id));this.store.dispatch({type:'TASK_STATUS',id,status,projectId:t?.projectId,entityId:id});this.bus.emit(`task:${status}`,{id});} };
</script><script>window.SeoGrowTechnical = window.SeoGrowTechnical || {};
SeoGrowTechnical.parseLinks = text => { const cleaned=String(text||'').replace(/^\uFEFF/,'').trim(); if(!cleaned) return []; if(cleaned.startsWith('[')){const data=JSON.parse(cleaned);if(!Array.isArray(data))throw new Error('Il JSON deve contenere un array');return data.map(x=>({source:String(x.source||'').trim(),target:String(x.target||'').trim(),status:Number(x.status)}));} const lines=cleaned.split(/\r?\n/).filter(Boolean);const separator=lines[0].includes(';')?';':',';const headers=lines.shift().split(separator).map(x=>x.trim().toLowerCase());const at=n=>headers.indexOf(n);if([at('source'),at('target'),at('status')].some(i=>i<0))throw new Error('CSV non valido: servono le colonne source, target, status');return lines.map(line=>{const c=line.split(separator).map(x=>x.trim().replace(/^"|"$/g,''));return {source:c[at('source')],target:c[at('target')],status:Number(c[at('status')])};}); };
SeoGrowTechnical.validateLinks = records => {const valid=[],invalid=[];records.forEach((r,index)=>{if(!SeoGrowUtils.safeUrl(r.source)||!SeoGrowUtils.safeUrl(r.target)||!Number.isInteger(r.status))invalid.push({index:index+1,reason:'URL o stato HTTP non valido'});else valid.push({...r,source:SeoGrowUtils.safeUrl(r.source),target:SeoGrowUtils.safeUrl(r.target)});});return {valid,invalid};};
SeoGrowTechnical.analyzeBrokenLinks = (projectId, records) => records.filter(r=>[404,410].includes(r.status)).map(r=>({projectId,type:'broken_internal_link',title:'Link interno rotto confermato',description:`${r.source} punta a ${r.target} e restituisce HTTP ${r.status}.`,severity:'high',impact:'high',confidence:100,source:'IMPORTED',affectedItems:[r.source,r.target],evidence:[{type:'http_status',source:'IMPORTED',value:r.status,reliability:'CONFIRMED',timestamp:SeoGrowUtils.now(),note:`Origine: ${r.source}`}],signature:SeoGrowUtils.signature(projectId,'broken_internal_link',r.source,r.target,r.status)}));
</script><script>SeoGrowCore.healthCheck = app => {const s=app.store.getState(), ids=new Set(),issues=[]; const add=(level,message)=>issues.push({level,message}); for(const p of s.projects){if(ids.has(p.id))add('FAIL','ID progetto duplicato');ids.add(p.id)} for(const f of s.findings){if(!s.projects.some(p=>p.id===f.projectId))add('FAIL',`Finding senza progetto: ${f.title}`);if(!SeoGrow.FINDING_STATES.includes(f.status))add('FAIL',`Stato finding non valido: ${f.status}`)} for(const t of s.tasks){if(!s.projects.some(p=>p.id===t.projectId))add('FAIL',`Task senza progetto: ${t.title}`);if(!s.findings.some(f=>f.id===t.findingId))add('FAIL',`Task senza finding: ${t.title}`);if(!SeoGrow.TASK_STATES.includes(t.status))add('FAIL',`Stato task non valido: ${t.status}`)} if(!issues.length)add('PASS','Integrità dati, referenze e stati verificati'); return issues; };
</script><script>window.SeoGrowUI = window.SeoGrowUI || {};
SeoGrowUI.App = class { constructor(app){this.app=app;this.view='dashboard';this.message=''} mount(root){this.root=root;document.addEventListener('click',e=>this.click(e));document.addEventListener('change',e=>this.change(e));this.app.bus.on('state:changed',()=>this.render());this.render()} notify(message,type='success'){this.message={message,type};this.render()} click(e){const el=e.target.closest('[data-action],[data-view]');if(!el)return;try{if(el.dataset.view){this.view=el.dataset.view;this.render();return}const id=el.dataset.id,a=el.dataset.action;if(a==='new-project'){const domain=prompt('Dominio del progetto (es. esempio.it)');if(domain)this.app.createProject(domain)}if(a==='validate')this.app.findings.status(id,'validated');if(a==='exclude')this.app.findings.status(id,'excluded');if(a==='create-task')this.app.tasks.create(id);if(a==='approve')this.app.tasks.status(id,'approved');if(a==='start')this.app.tasks.status(id,'executing');if(a==='complete')this.app.tasks.status(id,'completed');if(a==='verify')this.app.tasks.status(id,'verification_pending');if(a==='verified')this.app.tasks.status(id,'verified');if(a==='health')this.health();if(a==='backup')this.download('seogrow-backup.json',this.app.storage.backup(this.app.store.getState()));if(a==='import-links')this.importLinks();}catch(error){this.notify(error.message,'error')}} change(e){if(e.target.id==='projectSelect')this.app.store.dispatch({type:'PROJECT_SELECTED',id:e.target.value});}
 async importLinks(){const input=document.getElementById('linkFile');const file=input?.files?.[0];if(!file)throw new Error('Seleziona un CSV o JSON prima di importare');const text=await file.text();const parsed=SeoGrowTechnical.parseLinks(text), result=SeoGrowTechnical.validateLinks(parsed), pid=this.app.store.select(s=>s.activeProjectId);if(!result.valid.length)throw new Error('Nessun record valido: controlla il formato del file');const ds={id:SeoGrowUtils.id('dataset'),projectId:pid,type:'internal-links',source:'IMPORTED',importedAt:SeoGrowUtils.now(),records:result.valid.length,invalid:result.invalid.length};this.app.store.dispatch({type:'DATASET_IMPORTED',dataset:ds,projectId:pid});SeoGrowTechnical.analyzeBrokenLinks(pid,result.valid).forEach(x=>this.app.findings.create(x));this.notify(`Importati ${result.valid.length} record; ${result.invalid.length} ignorati. Rilevati solo link HTTP 404/410 confermati.`)}
 download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)} health(){const list=SeoGrowCore.healthCheck(this.app);this.notify(list.map(x=>`${x.level}: ${x.message}`).join(' · '),list.some(x=>x.level==='FAIL')?'error':'success')}
 project(){return this.app.store.select(s=>s.projects.find(p=>p.id===s.activeProjectId))} state(){return this.app.store.getState()} badge(v){return `<span class="status ${SeoGrowUtils.escapeHTML(v)}">${SeoGrowUtils.escapeHTML(v.replaceAll('_',' '))}</span>`} layout(content){const s=this.state();return `<header><strong>seoGrow <small>v${SeoGrow.VERSION}</small></strong><div><select id="projectSelect">${s.projects.map(p=>`<option value="${p.id}" ${p.id===s.activeProjectId?'selected':''}>${SeoGrowUtils.escapeHTML(p.domain)}</option>`).join('')}</select><button data-action="new-project">+ Progetto</button></div></header><div class="shell"><aside><div class="brand"><b>seoGrow</b><span>SEO data → decisioni</span></div>${[['dashboard','Dashboard'],['findings','Riscontri'],['technical','Link interni'],['tasks','Attività'],['settings','Integrità e backup']].map(([id,t])=>`<button class="nav ${this.view===id?'active':''}" data-view="${id}">${t}</button>`).join('')}</aside><main>${this.message?`<div class="notice ${this.message.type}">${SeoGrowUtils.escapeHTML(this.message.message)}</div>`:''}${content}</main></div>`}
 dashboard(){const s=this.state(),pid=s.activeProjectId,fs=s.findings.filter(x=>x.projectId===pid),ts=s.tasks.filter(x=>x.projectId===pid);return `<section class="hero"><h1>Una base affidabile per le decisioni SEO</h1><p>I dati importati diventano riscontri verificabili; solo dopo la validazione possono generare attività.</p><button class="primary" data-view="technical">Importa dati link interni</button></section><section class="metrics"><div><b>${s.datasets.filter(x=>x.projectId===pid).length}</b><span>Dataset</span></div><div><b>${fs.length}</b><span>Riscontri</span></div><div><b>${ts.filter(t=>!['verified','archived'].includes(t.status)).length}</b><span>Attività aperte</span></div><div><b>${ts.filter(t=>t.status==='verified').length}</b><span>Verificate</span></div></section><section class="card"><h2>Flusso controllato</h2><p>Dati → analisi → riscontro → validazione → attività → applicazione → verifica. I moduli non ancora realizzati non mostrano dati simulati.</p></section>`}
 findings(){const rows=this.state().findings.filter(x=>x.projectId===this.state().activeProjectId);return `<h1>Riscontri</h1><p class="muted">Un riscontro non è automaticamente un errore: richiede evidenza e validazione.</p><section class="card">${rows.length?rows.map(f=>`<article class="row"><div><b>${SeoGrowUtils.escapeHTML(f.title)}</b><p>${SeoGrowUtils.escapeHTML(f.description)}</p><small>Confidence ${f.confidence}% · evidenze ${f.evidence.length}</small></div><div>${this.badge(f.status)}</div><div class="actions">${f.status==='candidate'?`<button data-action="validate" data-id="${f.id}">Valida</button><button data-action="exclude" data-id="${f.id}">Escludi</button>`:''}${f.status==='validated'?`<button class="primary" data-action="create-task" data-id="${f.id}">Crea attività</button>`:''}</div></article>`).join(''):'<div class="empty">Nessun riscontro. Importa un dataset reale per iniziare.</div>'}</section>`}
 technical(){return `<h1>Verifica link interni</h1><p class="muted">Modulo reale 0.2: importa un CSV/JSON con <code>source,target,status</code>. Rileva soltanto HTTP 404 e 410 confermati; non inventa errori.</p><section class="card"><label for="linkFile">File CSV o JSON</label><input id="linkFile" type="file" accept=".csv,.json,application/json,text/csv"><p><small>CSV: intestazione obbligatoria <code>source,target,status</code>.</small></p><button class="primary" data-action="import-links">Importa e analizza</button></section><section class="card"><h2>Limitazioni dichiarate</h2><p>Un file standalone non può eseguire un crawl cross-origin affidabile senza un connettore. Qui vengono analizzati solo dati realmente importati.</p></section>`}
 tasks(){const rows=this.state().tasks.filter(x=>x.projectId===this.state().activeProjectId);const next={todo:['approve','Approva'],approved:['start','Avvia'],executing:['complete','Completa'],completed:['verify','Richiedi verifica'],verification_pending:['verified','Segna verificata']};return `<h1>Attività</h1><section class="card">${rows.length?rows.map(t=>`<article class="row"><div><b>${SeoGrowUtils.escapeHTML(t.title)}</b><p>${SeoGrowUtils.escapeHTML(t.description)}</p></div><div>${this.badge(t.status)}</div><div>${next[t.status]?`<button data-action="${next[t.status][0]}" data-id="${t.id}">${next[t.status][1]}</button>`:''}</div></article>`).join(''):'<div class="empty">Nessuna attività. Le attività possono nascere solo da riscontri validati.</div>'}</section>`}
 settings(){const s=this.state();return `<h1>Integrità e backup</h1><section class="card"><h2>Controlli disponibili</h2><p>Stato, referenze tra entità, isolamenti progetto e stati ammessi vengono verificati senza modificare i dati.</p><div class="actions"><button class="primary" data-action="health">Controlla integrità applicazione</button><button data-action="backup">Scarica backup completo</button></div><p class="muted">Schema dati ${s.schemaVersion}; storico: ${s.history.length} eventi.</p></section>`}
 render(){if(!this.root)return;const pages={dashboard:()=>this.dashboard(),findings:()=>this.findings(),technical:()=>this.technical(),tasks:()=>this.tasks(),settings:()=>this.settings()};this.root.innerHTML=this.layout(pages[this.view]())} };
</script><script>window.SeoGrowApp = class { constructor(){this.bus=new SeoGrowCore.EventBus();this.logger=new SeoGrowCore.Logger();this.storage=new SeoGrowCore.Storage();try{const saved=this.storage.load();const initial={appVersion:SeoGrow.VERSION,schemaVersion:SeoGrow.SCHEMA_VERSION,activeProjectId:null,projects:[],datasets:[],findings:[],tasks:[],history:[],settings:{autosave:true}};this.store=new SeoGrowCore.Store(SeoGrowCore.migrate(saved||initial),this.bus,this.logger)}catch(error){this.recovery=error;this.store=new SeoGrowCore.Store({appVersion:SeoGrow.VERSION,schemaVersion:SeoGrow.SCHEMA_VERSION,activeProjectId:null,projects:[],datasets:[],findings:[],tasks:[],history:[],settings:{}},this.bus,this.logger)}this.findings=new SeoGrowServices.FindingService(this.store,this.bus);this.tasks=new SeoGrowServices.TaskService(this.store,this.bus);this.bus.on('state:changed',({state})=>{try{this.storage.save(state);this.bus.emit('storage:saved')}catch(error){this.logger.error('storage','save',{error:error.message});this.bus.emit('storage:error',{error})}})} createProject(domain){let url;try{url=new URL(/^https?:/i.test(domain)?domain:`https://${domain}`)}catch{throw new Error('Dominio non valido')}const project={id:SeoGrowUtils.id('prj'),domain:url.hostname.replace(/^www\./,''),name:url.hostname,createdAt:SeoGrowUtils.now()};this.store.dispatch({type:'PROJECT_CREATED',project});} start(){if(!this.store.select(s=>s.projects.length))this.createProject('esempio.it');this.ui=new SeoGrowUI.App(this);this.ui.mount(document.getElementById('app'));if(this.recovery)this.ui.notify('Dati precedenti non leggibili: avviata modalità di recupero senza sovrascrivere il backup.','error')}};document.addEventListener('DOMContentLoaded',()=>new SeoGrowApp().start());
</script></body></html>
