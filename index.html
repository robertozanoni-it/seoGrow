<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>seoGrow 0.2.0</title><style>:root{--bg:#f5f7f6;--surface:#fff;--text:#162019;--muted:#617066;--line:#dce4de;--green:#146c43;--dark:#102017;--danger:#a13232;--warning:#8a5a00;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,select,input{font:inherit}button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 12px;cursor:pointer}button:hover{border-color:#91a99b}.primary{background:var(--green);border-color:var(--green);color:#fff}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}header small{color:var(--muted);font-weight:500}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{background:var(--dark);padding:20px 12px}.brand{color:#fff;padding:0 10px 20px}.brand span{display:block;color:#aebbb2;font-size:12px}.nav{width:100%;text-align:left;border:0;background:transparent;color:#b7c4ba;margin:2px 0}.nav.active,.nav:hover{background:#1f3728;color:#fff;box-shadow:inset 3px 0 #5bd28e}main{padding:28px;max-width:1300px}.hero,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px}.hero{background:linear-gradient(135deg,#fff,#eef8f1)}h1{font-size:30px;line-height:1.15;margin:0 0 8px}h2{font-size:18px;margin:0 0 8px}.muted,small{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metrics div{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}.metrics b{display:block;font-size:28px}.metrics span{color:var(--muted)}.row{display:grid;grid-template-columns:minmax(0,1fr) 150px .progress{height:9px;border-radius:99px;background:#dfe8e2;margin:18px 0 6px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:99px}.wizard-list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px}.wizard-step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px;border-bottom:1px solid var(--line)}.wizard-step:last-child{border-bottom:0}.wizard-step p{margin:4px 0 0;color:var(--muted)}.step-number{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef1ef;font-weight:800;color:var(--muted)}.wizard-step.complete .step-number{background:#e6f5eb;color:var(--green)}@media(max-width:560px){.wizard-step{grid-template-columns:34px 1fr}.wizard-step>div:last-child{grid-column:2}.wizard-step button{width:100%}}

</style></head><body><div id="app"></div><script>window.SeoGrowModules = window.SeoGrowModules || {};
window.SeoGrowModules.contracts = {
  core: { id: 'core', version: '0.2.0', responsibility: 'Stato, eventi, routing, recovery e persistenza' },
  technical: {
    id: 'technical', version: '0.2.0', responsibility: 'Importa un elenco di link interni e rileva esclusivamente HTTP 404/410 confermati.',

  }
};
</script><script>window.SeoGrow = window.SeoGrow || {};
SeoGrow.VERSION = '0.10.1'; SeoGrow.SCHEMA_VERSION = 3;
SeoGrow.FINDING_STATES = ['candidate','validated','insufficient_data','excluded','task_created','resolved','obsolete','reopened'];
SeoGrow.TASK_STATES = ['todo','pending_approval','approved','executing','completed','verification_pending','verified','failed','archived','obsolete'];
SeoGrow.TRANSITIONS = { finding:{candidate:['validated','insufficient_data','excluded'],validated:['task_created','resolved','obsolete'],task_created:['resolved','reopened'],resolved:['reopened'],obsolete:['reopened'],reopened:['validated','excluded']}, task:{todo:['pending_approval','approved','archived'],pending_approval:['approved','archived'],approved:['executing','archived'],executing:['completed','failed'],completed:['verification_pending'],verification_pending:['verified','failed'],failed:['approved','archived'],verified:['archived'],archived:[]} };
</script><script>window.SeoGrowUtils = window.SeoGrowUtils || {};
SeoGrowUtils.id = prefix => `${prefix}_${crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(36).slice(2)}`}`;
SeoGrowUtils.now = () => new Date().toISOString();
SeoGrowUtils.clone = value => JSON.parse(JSON.stringify(value));
SeoGrowUtils.escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
SeoGrowUtils.safeUrl = value => { try { const u = new URL(String(value), location.href); return ['http:','https:'].includes(u.protocol) ? u.href : ''; } catch { return ''; } };
SeoGrowUtils.signature = (...bits) => bits.map(x => String(x || '').trim().toLowerCase()).join('|');
</script><script>window.SeoGrowCore = window.SeoGrowCore || {};
SeoGrowCore.EventBus = class { constructor(){ this.events = new Map(); this.recent = []; }
  on(name, handler){ if(!this.events.has(name)) this.events.set(name,new Set()); this.events.get(name).add(handler); return () => this.off(name,handler); }
  once(name, handler){ const off=this.on(name,p=>{off();handler(p)}); return off; }
  off(name, handler){ this.events.get(name)?.delete(handler); }
  emit(name,payload={}){ this.recent.unshift({name,at:SeoGrowUtils.now(),payload}); this.recent=this.recent.slice(0,50); (this.events.get(name)||[]).forEach(fn=>{try{fn(payload)}catch(error){console.error('[seoGrow]',name,error)}}); }
};
</script><script>SeoGrowCore.Logger = class { constructor(){this.items=[]} log(level,module,action,context={}){this.items.unshift({level,module,action,context,at:SeoGrowUtils.now()});this.items=this.items.slice(0,200)} debug(m,a,c){this.log('debug',m,a,c)} info(m,a,c){this.log('info',m,a,c)} warn(m,a,c){this.log('warn',m,a,c)} error(m,a,c){this.log('error',m,a,c)} };
</script><script>SeoGrowCore.migrate = raw => { const state=SeoGrowUtils.clone(raw || {}); const version=Number(state.schemaVersion || 1); if(version < 2){ state.history=Array.isArray(state.history)?state.history:[]; state.datasets=Array.isArray(state.datasets)?state.datasets:[]; state.settings={autosave:true,...state.settings}; (state.findings||[]).forEach(f=>{f.description=f.description||f.summary||'';f.affectedItems=f.affectedItems||f.affected||[];f.signature=f.signature||SeoGrowUtils.signature(f.projectId,f.type,f.source,(f.affectedItems||[])[0]);}); } if(version < 3){ state.backupMeta={lastRestoreAt:null,lastBackupAt:null}; state.settings={autosave:true,storage:'indexeddb',...state.settings}; } state.schemaVersion=SeoGrow.SCHEMA_VERSION;state.appVersion=SeoGrow.VERSION; return state; };
</script><script>SeoGrowCore.Storage = class { constructor(key='seogrow:state'){this.key=key;this.dbName='seogrow';this.storeName='state'} async db(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB non disponibile'));const request=indexedDB.open(this.dbName,1);request.onupgradeneeded=()=>request.result.createObjectStore(this.storeName);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})} async load(){try{const db=await this.db();return await new Promise((resolve,reject)=>{const r=db.transaction(this.storeName,'readonly').objectStore(this.storeName).get(this.key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(error){const raw=localStorage.getItem(this.key);return raw?JSON.parse(raw):null}} async save(state){try{const db=await this.db();await new Promise((resolve,reject)=>{const r=db.transaction(this.storeName,'readwrite').objectStore(this.storeName).put(state,this.key);r.onsuccess=resolve;r.onerror=()=>reject(r.error)});localStorage.setItem(`${this.key}:meta`,JSON.stringify({schemaVersion:state.schemaVersion,updatedAt:SeoGrowUtils.now()}))}catch(error){localStorage.setItem(this.key,JSON.stringify(state));return 'fallback'}} backup(state){return JSON.stringify({appVersion:SeoGrow.VERSION,schemaVersion:SeoGrow.SCHEMA_VERSION,exportedAt:SeoGrowUtils.now(),...state},null,2)} validateBackup(text){let data;try{data=JSON.parse(text)}catch{throw new Error('Il backup non è JSON valido')}if(!data||!Array.isArray(data.projects)||!Array.isArray(data.findings)||!Array.isArray(data.tasks))throw new Error('Il backup non contiene una struttura seoGrow valida');if(Number(data.schemaVersion)>SeoGrow.SCHEMA_VERSION)throw new Error('Backup creato da una versione più recente');return SeoGrowCore.migrate(data)} };
</script><script>SeoGrowCore.Store = class { constructor(initial,bus,logger){this.state=SeoGrowUtils.clone(initial);this.bus=bus;this.logger=logger} getState(){return SeoGrowUtils.clone(this.state)} select(fn){return fn(this.state)} dispatch(action){const s=SeoGrowUtils.clone(this.state); const at=SeoGrowUtils.now(); switch(action.type){
case 'PROJECT_CREATED':s.projects.push(action.project);s.activeProjectId=action.project.id;break; case 'PROJECT_SELECTED':s.activeProjectId=action.id;break;
case 'CONNECTION_UPDATED':s.settings={...s.settings,connections:{...(s.settings.connections||{}),[action.connection]:action.value}};break;
case 'DATASET_IMPORTED':s.datasets.push(action.dataset);break; case 'FINDING_UPSERTED':{const i=s.findings.findIndex(x=>x.signature===action.finding.signature);if(i>-1)s.findings[i]={...s.findings[i],...action.finding,updatedAt:at};else s.findings.push(action.finding);break;}
case 'FINDING_STATUS':{const f=s.findings.find(x=>x.id===action.id);if(!f)throw new Error('Finding inesistente');this.transition('finding',f.status,action.status);f.status=action.status;f.updatedAt=at;break;}
case 'TASK_CREATED':s.tasks.push(action.task);break; case 'TASK_STATUS':{const t=s.tasks.find(x=>x.id===action.id);if(!t)throw new Error('Task inesistente');this.transition('task',t.status,action.status);t.status=action.status;t.updatedAt=at;break;} default:throw new Error(`Azione non supportata: ${action.type}`)}
s.history.push({id:SeoGrowUtils.id('history'),projectId:action.projectId||s.activeProjectId,entityType:action.entityType||action.type.split('_')[0].toLowerCase(),entityId:action.entityId||action.id||action.project?.id||action.dataset?.id||action.finding?.id||action.task?.id,action:action.type,timestamp:at,metadata:action.metadata||{}}); this.state=s;this.bus.emit('state:changed',{action,state:this.getState()});return this.getState() }
  transition(kind,from,to){if(!(SeoGrow.TRANSITIONS[kind][from]||[]).includes(to))throw new Error(`Transizione ${kind} non valida: ${from} → ${to}`)} replace(next,meta={}){this.state=SeoGrowUtils.clone(next);this.bus.emit('state:changed',{action:{type:'STATE_RESTORED',...meta},state:this.getState()});return this.getState()} };
</script><script>window.SeoGrowServices = window.SeoGrowServices || {};
SeoGrowServices.FindingService = class { constructor(store,bus){this.store=store;this.bus=bus} create(candidate){const now=SeoGrowUtils.now();const f={id:SeoGrowUtils.id('finding'),projectId:candidate.projectId,type:candidate.type,title:candidate.title,description:candidate.description||'',status:'candidate',severity:candidate.severity||'medium',impact:candidate.impact||'medium',confidence:Number(candidate.confidence||0),evidence:candidate.evidence||[],affectedItems:candidate.affectedItems||[],source:candidate.source||'UNKNOWN',signature:candidate.signature,createdAt:now,updatedAt:now};this.store.dispatch({type:'FINDING_UPSERTED',finding:f,projectId:f.projectId});this.bus.emit('finding:created',f);return f} status(id,status){const f=this.store.select(s=>s.findings.find(x=>x.id===id));this.store.dispatch({type:'FINDING_STATUS',id,status,projectId:f?.projectId,entityId:id});this.bus.emit(`finding:${status}`,{id});} };
</script><script>SeoGrowServices.TaskService = class { constructor(store,bus){this.store=store;this.bus=bus} create(findingId){const f=this.store.select(s=>s.findings.find(x=>x.id===findingId));if(!f)throw new Error('Finding inesistente');if(f.status!=='validated')throw new Error('Valida il finding prima di creare una task');const duplicate=this.store.select(s=>s.tasks.find(t=>t.findingId===findingId&&!['archived','obsolete'].includes(t.status)));if(duplicate)return duplicate;const task={id:SeoGrowUtils.id('task'),projectId:f.projectId,findingId,title:f.title,description:f.description,type:f.type,priority:f.severity==='high'?'Alta':f.severity==='low'?'Bassa':'Media',status:'todo',createdAt:SeoGrowUtils.now()};this.store.dispatch({type:'TASK_CREATED',task,projectId:f.projectId});this.store.dispatch({type:'FINDING_STATUS',id:f.id,status:'task_created',projectId:f.projectId});this.bus.emit('task:created',task);return task} status(id,status){const t=this.store.select(s=>s.tasks.find(x=>x.id===id));this.store.dispatch({type:'TASK_STATUS',id,status,projectId:t?.projectId,entityId:id});this.bus.emit(`task:${status}`,{id});} };
</script><script>window.SeoGrowTechnical = window.SeoGrowTechnical || {};
SeoGrowTechnical.parseLinks = text => { const cleaned=String(text||'').replace(/^\uFEFF/,'').trim(); if(!cleaned) return []; if(cleaned.startsWith('[')){const data=JSON.parse(cleaned);if(!Array.isArray(data))throw new Error('Il JSON deve contenere un array');return data.map(x=>({source:String(x.source||'').trim(),target:String(x.target||'').trim(),status:Number(x.status)}));} const lines=cleaned.split(/\r?\n/).filter(Boolean);const separator=lines[0].includes(';')?';':',';const headers=lines.shift().split(separator).map(x=>x.trim().toLowerCase());const at=n=>headers.indexOf(n);if([at('source'),at('target'),at('status')].some(i=>i<0))throw new Error('CSV non valido: servono le colonne source, target, status');return lines.map(line=>{const c=line.split(separator).map(x=>x.trim().replace(/^"|"$/g,''));return {source:c[at('source')],target:c[at('target')],status:Number(c[at('status')])};}); };
SeoGrowTechnical.validateLinks = records => {const valid=[],invalid=[];records.forEach((r,index)=>{if(!SeoGrowUtils.safeUrl(r.source)||!SeoGrowUtils.safeUrl(r.target)||!Number.isInteger(r.status))invalid.push({index:index+1,reason:'URL o stato HTTP non valido'});else valid.push({...r,source:SeoGrowUtils.safeUrl(r.source),target:SeoGrowUtils.safeUrl(r.target)});});return {valid,invalid};};
SeoGrowTechnical.analyzeBrokenLinks = (projectId, records) => records.filter(r=>[404,410].includes(r.status)).map(r=>({projectId,type:'broken_internal_link',title:'Link interno rotto confermato',description:`${r.source} punta a ${r.target} e restituisce HTTP ${r.status}.`,severity:'high',impact:'high',confidence:100,source:'IMPORTED',affectedItems:[r.source,r.target],evidence:[{type:'http_status',source:'IMPORTED',value:r.status,reliability:'CONFIRMED',timestamp:SeoGrowUtils.now(),note:`Origine: ${r.source}`}],signature:SeoGrowUtils.signature(projectId,'broken_internal_link',r.source,r.target,r.status)}));
</script><script>window.SeoGrowSearchConsole = window.SeoGrowSearchConsole || {};
SeoGrowSearchConsole.parse = text => {const lines=String(text||'').replace(/^\uFEFF/,'').trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)throw new Error('Il CSV Search Console non contiene record');const sep=lines[0].includes(';')?';':',';const header=lines.shift().split(sep).map(x=>x.trim().toLowerCase());const index=(...names)=>header.findIndex(x=>names.includes(x));const q=index('query','query principale'),url=index('page','pagina','url'),clicks=index('clicks','clic'),impressions=index('impressions','impressioni'),position=index('position','posizione');if([q,url,clicks,impressions,position].some(x=>x<0))throw new Error('CSV non supportato: servono Query, Page, Clicks, Impressions e Position');return lines.map(line=>{const c=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));return {query:c[q],url:c[url],clicks:Number(c[clicks]),impressions:Number(c[impressions]),position:Number(String(c[position]).replace(',','.'))}}).filter(r=>r.query&&SeoGrowUtils.safeUrl(r.url)&&Number.isFinite(r.impressions));};
SeoGrowSearchConsole.cannibalization = (projectId,rows) => {const byQuery=new Map();rows.forEach(r=>{const k=r.query.toLowerCase().trim();if(!byQuery.has(k))byQuery.set(k,[]);byQuery.get(k).push({...r,url:SeoGrowUtils.safeUrl(r.url)})});return [...byQuery].flatMap(([query,list])=>{const pages=[...new Map(list.map(r=>[r.url,r])).values()].sort((a,b)=>b.impressions-a.impressions||a.url.localeCompare(b.url));const total=pages.reduce((n,r)=>n+r.impressions,0);if(pages.length<2||total<20||pages[1].impressions<5||pages[1].impressions/total<.12)return [];return [{projectId,type:'cannibalization',title:`Possibile cannibalizzazione: ${query}`,description:`${pages.length} URL hanno ricevuto impressioni per la stessa query. Verifica l'intento prima di intervenire.`,severity:'medium',impact:'medium',confidence:85,source:'IMPORTED',affectedItems:pages.map(x=>x.url),evidence:pages.map(x=>({type:'gsc_page_query',source:'IMPORTED',value:{url:x.url,impressions:x.impressions,clicks:x.clicks,position:x.position},reliability:'HIGH',timestamp:SeoGrowUtils.now()})),signature:SeoGrowUtils.signature(projectId,'cannibalization',query,pages.map(x=>x.url).join(','))}]});};
</script><script>window.SeoGrowSearchConsoleBundle=window.SeoGrowSearchConsoleBundle||{};
SeoGrowSearchConsoleBundle.header=function(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()};
SeoGrowSearchConsoleBundle.row=function(line,sep){var out=[],value='',quoted=false;for(var i=0;i<line.length;i++){var char=line[i];if(char==='"'){if(quoted&&line[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(char===sep&&!quoted){out.push(value.trim());value=''}else value+=char}out.push(value.trim());return out};
SeoGrowSearchConsoleBundle.csv=function(text){var lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(x){return x.trim()!==''});if(!lines.length)return {headers:[],rows:[]};var sep=lines[0].indexOf(';')>-1?';':',';var headers=SeoGrowSearchConsoleBundle.row(lines.shift(),sep).map(function(x){return x.trim()});return {headers:headers,rows:lines.map(function(line){var c=SeoGrowSearchConsoleBundle.row(line,sep),row={};headers.forEach(function(h,i){row[h]=String(c[i]||'').trim()});return row})};};

</script><script>(function(){var proto=SeoGrowUI.App.prototype,previousSettings=proto.settings;proto.importLinks=async function(){var file=document.getElementById('linkFile')&&document.getElementById('linkFile').files[0];if(!file)throw Error('Seleziona un CSV o JSON');var project=this.app.store.select(function(s){return s.activeProjectId}),result=SeoGrowTechnical.validateLinks(SeoGrowTechnical.parseLinks(await file.text()));if(!result.valid.length)throw Error('Nessun record link valido');this.app.store.dispatch({type:'DATASET_IMPORTED',dataset:{id:SeoGrowUtils.id('dataset'),projectId:project,type:'internal-links',source:'CSV',importedAt:SeoGrowUtils.now(),records:result.valid.length,invalid:result.invalid.length,data:result.valid,provenance:{fileName:file.name}}});SeoGrowTechnical.analyzeBrokenLinks(project,result.valid).forEach(this.app.findings.create.bind(this.app.findings));this.notify('Importati '+result.valid.length+' link; '+result.invalid.length+' ignorati.')};proto.settings=function(){var state=this.state(),project=state.activeProjectId,datasets=state.datasets.filter(function(item){return item.projectId===project});var rows=datasets.length?datasets.slice().reverse().map(function(item){var sample=Array.isArray(item.data)?item.data.slice(0,3):[];var info=item.provenance&&item.provenance.cost!==undefined&&item.provenance.cost!==null?' · costo $'+Number(item.provenance.cost).toFixed(4):'';return '<article class="dataset-row"><div><b>'+SeoGrowUtils.escapeHTML(item.type.replace(/^search-console-/,'Search Console · ').replace(/^dataforseo-/,'DataForSEO · '))+'</b><p>'+SeoGrowUtils.escapeHTML(item.source||'IMPORTED')+' · '+item.records+' record · '+new Date(item.importedAt).toLocaleString('it-IT')+info+'</p>'+(item.provenance&&item.provenance.fileName?'<small>File: '+SeoGrowUtils.escapeHTML(item.provenance.fileName)+'</small>':'')+'</div><details><summary>Anteprima</summary><pre>'+SeoGrowUtils.escapeHTML(JSON.stringify(sample,null,2))+'</pre></details></article>'}) </script><script>window.SeoGrowApp=class{constructor(){this.bus=new SeoGrowCore.EventBus();this.logger=new SeoGrowCore.Logger();this.storage=new SeoGrowCore.Storage();this.wordpress=null;this.initial={appVersion:SeoGrow.VERSION,schemaVersion:SeoGrow.SCHEMA_VERSION,activeProjectId:null,projects:[],datasets:[],findings:[],tasks:[],history:[],backupMeta:{lastRestoreAt:null,lastBackupAt:null},settings:{autosave:true,storage:'indexeddb',connections:{}}}}async start(){try{const saved=await this.storage.load();this.store=new SeoGrowCore.Store(SeoGrowCore.migrate(saved||this.initial),this.bus,this.logger)}catch(error){this.recovery=error;this.store=new SeoGrowCore.Store(this.initial,this.bus,this.logger)}this.findings=new SeoGrowServices.FindingService(this.store,this.bus);this.tasks=new SeoGrowServices.TaskService(this.store,this.bus);this.bus.on('state:changed',({state})=>{this.storage.save(state).then(()=>this.bus.emit('storage:saved')).catch(error=>{this.logger.error('storage','save',{error:error.message});this.bus.emit('storage:error',{error})})});if(!this.store.select(s=>s.projects.length))this.createProject('esempio.it');this.ui=new SeoGrowUI.App(this);this.ui.mount(document.getElementById('app'));if(this.recovery)this.ui.notify('Dati precedenti non leggibili: avviata modalità di recupero senza sovrascrivere il backup.','error')}createProject(domain){let url;try{url=new URL(/^https?:/i.test(domain)?domain:`https://${domain}`)}catch{throw Error('Dominio non valido')}const project={id:SeoGrowUtils.id('prj'),domain:url.hostname.replace(/^www\./,''),name:url.hostname,createdAt:SeoGrowUtils.now()};this.store.dispatch({type:'PROJECT_CREATED',project})}async connectWordPress(){const project=this.store.select(s=>s.projects.find(x=>x.id===s.activeProjectId));const site=prompt('URL completo del sito WordPress',`https://${project.domain}`);if(!site)throw Error('Connessione annullata');const username=prompt('Nome utente WordPress autorizzato');if(!username)throw Error('Connessione annullata');const password=prompt('Password applicazione WordPress');if(!password)throw Error('Connessione annullata');const base=site.replace(/\/$/,'');const auth='Basic '+btoa(`${username}:${password.replace(/\s/g,'')}`);const res=await fetch(`${base}/wp-json/seogrow/v1/capabilities`,{headers:{Authorization:auth}});if(!res.ok)throw Error(`Connessione WordPress non riuscita (HTTP ${res.status}). Verifica plugin, URL e Password applicazione.`);this.wordpress={base,auth};this.store.dispatch({type:'CONNECTION_UPDATED',connection:'wordpress',value:{base,connectedAt:SeoGrowUtils.now(),capabilities:await res.json()}});return this.wordpress}async importWordPressPages(){if(!this.wordpress)await this.connectWordPress();const all=[],perPage=100;let page=1,total=Infinity;while(all.length<total){const res=await fetch(`${this.wordpress.base}/wp-json/seogrow/v1/pages?per_page=${perPage}&page=${page}`,{headers:{Authorization:this.wordpress.auth}});let payload;try{payload=await res.json()}catch{throw Error(`Risposta WordPress non valida (HTTP ${res.status})`)}if(!res.ok)throw Error(payload.message||`Lettura pagine non riuscita (HTTP ${res.status})`);const rows=(payload.rows||[]).map(r=>({url:r.url,title:r.title||'',meta:r.metaDescription||'',h1:r.h1||'',canonical:r.canonical||'',indexability:r.indexability||'unknown'}));all.push(...rows);total=Number(payload.total||all.length);if(!rows.length||rows.length<perPage)break;page++}if(!all.length)throw Error('Il connettore non ha restituito pagine pubblicate');const p=this.store.select(s=>s.activeProjectId);this.store.dispatch({type:'DATASET_IMPORTED',dataset:{id:SeoGrowUtils.id('dataset'),projectId:p,type:'pages-onpage',source:'WORDPRESS_CONNECTOR',importedAt:SeoGrowUtils.now(),records:all.length,invalid:0,data:all,provenance:{pagesFetched:page}}});SeoGrowPages.analyze(p,all).forEach(x=>this.findings.create(x));return {records:all.length,pages:page}}async importDataForSeoCompetitors(){if(!this.wordpress)await this.connectWordPress();const p=this.store.select(s=>s.activeProjectId),project=this.store.select(s=>s.projects.find(x=>x.id===p));if(!project)throw Error('Seleziona un progetto');if(!confirm(`Verrà eseguita una chiamata DataForSEO Live per ${project.domain}, che può consumare credito API. Vuoi procedere?`))return {cancelled:true};const res=await fetch(`${this.wordpress.base}/wp-json/seogrow/v1/dataforseo/competitors`,{method:'POST',headers:{Authorization:this.wordpress.auth,'Content-Type':'application/json'},body:JSON.stringify({target:project.domain})});let payload;try{payload=await res.json()}catch{throw Error(`Risposta DataForSEO non valida (HTTP ${res.status})`)}if(!res.ok)throw Error(payload.message||payload.code||`DataForSEO non disponibile (HTTP ${res.status})`);const rows=Array.isArray(payload.rows)?payload.rows:[];if(!rows.length)throw Error('DataForSEO non ha restituito competitor per questo dominio');this.store.dispatch({type:'DATASET_IMPORTED',dataset:{id:SeoGrowUtils.id('dataset'),projectId:p,type:'dataforseo-competitors',source:'DATAFORSEO',importedAt:SeoGrowUtils.now(),records:rows.length,invalid:0,data:rows,provenance:{target:payload.target||project.domain,retrievedAt:payload.retrievedAt||SeoGrowUtils.now(),cost:payload.cost}}});return {records:rows.length,cost:payload.cost,retrievedAt:payload.retrievedAt}}async restore(text){const next=this.storage.validateBackup(text);const current=this.store.getState();await this.storage.save(current);next.backupMeta={...(next.backupMeta||{}),lastRestoreAt:SeoGrowUtils.now()};this.store.replace(next,{source:'backup:restore'});await this.storage.save(next);return next}};document.addEventListener('DOMContentLoaded',()=>new SeoGrowApp().start());
