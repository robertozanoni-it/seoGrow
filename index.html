      return String(row.query || '').trim() !== '' && SeoGrowUtils.safeUrl(row.page);
    }).map(function (row) {
      return {sourceFile: 'API Google Search Console', data: {Query: row.query, Pagina: row.page}, metrics: {clicks: row.clicks, impressions: row.impressions, ctr: row.ctr, position: row.position}};
    });

    function save(app, type, rows) {
      app.store.dispatch({type: 'DATASET_IMPORTED', dataset: {
        id: SeoGrowUtils.id('dataset'), projectId: project.id, type: type, source: 'SEARCH_CONSOLE_API',
        importedAt: importedAt, records: rows.length, invalid: 0, data: rows,
        provenance: Object.assign({}, provenance)
      }});
    }
    save(this, 'search-console-queries', queries);
    save(this, 'search-console-pages', pages);
    save(this, 'search-console-query-page', queryPages);

    var findings = SeoGrowSearchConsole.cannibalization(project.id, queryPages.map(function (row) {
      return {query: row.data.Query, url: row.data.Pagina, clicks: Number(row.metrics.clicks || 0), impressions: Number(row.metrics.impressions || 0), position: Number(row.metrics.position || 0)};
    }));
    findings.forEach(function (finding) { this.findings.create(finding); }, this);
    return {queries: queries.length, pages: pages.length, queryPages: queryPages.length, findings: findings.length, truncated: payload.truncated === true};
  };

  var ui = SeoGrowUI.App.prototype;
  var previousGsc = ui.gsc;
  var previousClick = ui.click;

  function settingsUrl(view) {
    var app = view.app;
    var live = app.wordpress;
    var saved = view.state().settings.connections && view.state().settings.connections.wordpress || {};
    var capabilities = live && live.capabilities || saved.capabilities || {};
    var base = live && live.base || saved.base || '';
    var status = capabilities.searchConsole || {};
    return status.settingsUrl || capabilities.connectorSettingsUrl || (base ? base.replace(/\/+$/, '') + '/wp-admin/options-general.php?page=seogrow-connector#seogrow-search-console' : '');
  }

  function apiCard(view) {
    var connection = view.app.wordpress;
    var capabilities = connection && connection.capabilities || {};
    var status = capabilities.searchConsole || {};
    var link = settingsUrl(view);
    var settingsLink = link ? '<a class="dashboard-action-link" href="' + SeoGrowUtils.escapeHTML(link) + '" target="_blank" rel="noopener noreferrer">Apri configurazione OAuth nel plugin</a>' : '';

    if (!connection) {
      return '<section class="card"><h2>Collegamento diretto alle API di Google Search Console</h2><p class="muted">Collega prima WordPress: il plugin protegge Client Secret e token Google e inoltra alla web app soltanto i dati del dominio attivo.</p><div class="actions"><button class="primary" data-view="pages">Collega WordPress</button>' + settingsLink + '</div></section>';
    }
    if (status.connected !== true && capabilities.searchConsoleConnected !== true) {
      var label = status.configured === true || capabilities.searchConsoleConfigured === true ? 'Configurazione OAuth salvata, autorizzazione Google mancante.' : 'Search Console non è ancora configurata nel plugin WordPress.';
      return '<section class="card"><h2>Collegamento diretto alle API di Google Search Console</h2><p class="status candidate">Non collegata</p><p>' + SeoGrowUtils.escapeHTML(label) + '</p><div class="actions"><button class="primary" data-action="gsc-refresh-status">Aggiorna stato</button>' + settingsLink + '</div></section>';
    }

    var properties = Array.isArray(view.searchConsoleProperties) ? view.searchConsoleProperties : [];
    var selected = String(view.searchConsoleSelected || status.selectedProperty || '');
    var options = properties.map(function (property) {
      var value = property.siteUrl || '';
      return '<option value="' + SeoGrowUtils.escapeHTML(value) + '"' + (value === selected ? ' selected' : '') + '>' + SeoGrowUtils.escapeHTML(value) + ' · ' + SeoGrowUtils.escapeHTML(property.permissionLevel || 'accesso verificato') + '</option>';
    }).join('');
    var chooser = properties.length ? '<label for="gscApiProperty">Proprietà Search Console</label><select id="gscApiProperty">' + options + '</select><label for="gscApiDays">Periodo</label><select id="gscApiDays"><option value="7">Ultimi 7 giorni completi</option><option value="28" selected>Ultimi 28 giorni completi</option><option value="90">Ultimi 90 giorni completi</option></select><button class="primary" data-action="gsc-api-sync">Sincronizza Search Console</button>' : '<button class="primary" data-action="gsc-load-properties">Carica proprietà Search Console</button>';
    return '<section class="card"><h2>Collegamento diretto alle API di Google Search Console</h2><p class="status verified">Collegata in sola lettura</p><p class="muted">Scarica query, pagine e associazioni query‑pagina direttamente nel progetto attivo. Gli ultimi due giorni vengono esclusi per evitare dati ancora incompleti.</p><div class="actions gsc-api-actions">' + chooser + '<button data-action="gsc-refresh-status">Aggiorna stato</button>' + settingsLink + '</div>' + (view.searchConsoleMessage ? '<p><strong>' + SeoGrowUtils.escapeHTML(view.searchConsoleMessage) + '</strong></p>' : '') + '</section>';
  }

  ui.gsc = function () {
    var output = previousGsc.call(this);
    return output.replace(/^<h1>[^<]*<\/h1><p class="muted">[\s\S]*?<\/p>/, '<h1>Google Search Console</h1><p class="muted">Sincronizza direttamente tramite API oppure usa un export CSV/ZIP come alternativa manuale.</p>' + apiCard(this));
  };

  ui.click = async function (event) {
    var element = event.target.closest('[data-action],[data-view]');
    if (element && element.dataset.action === 'gsc-refresh-status') {
      try {
        await this.app.getSearchConsoleStatus();
        this.notify('Stato Search Console aggiornato dal plugin WordPress.');
      } catch (error) { this.notify(error.message, 'error'); }
      return;
    }
    if (element && element.dataset.action === 'gsc-load-properties') {
      try {
        this.searchConsoleProperties = await this.app.getSearchConsoleProperties();
        if (!this.searchConsoleProperties.length) throw new Error('L’account Google non contiene proprietà del dominio WordPress collegato. Verifica proprietà e permessi in Search Console.');
        this.searchConsoleSelected = this.searchConsoleProperties[0].siteUrl;
        this.searchConsoleMessage = this.searchConsoleProperties.length + ' proprietà compatibili caricate.';
        this.render();
      } catch (error) { this.notify(error.message, 'error'); }
      return;
    }
    if (element && element.dataset.action === 'gsc-api-sync') {
      var propertyInput = document.getElementById('gscApiProperty');
      var daysInput = document.getElementById('gscApiDays');
      try {
        var result = await this.app.syncSearchConsole(propertyInput && propertyInput.value, daysInput && daysInput.value);
        this.searchConsoleSelected = propertyInput && propertyInput.value;
        this.searchConsoleMessage = 'Sincronizzazione completata: ' + result.queries + ' query, ' + result.pages + ' pagine, ' + result.queryPages + ' coppie query‑pagina' + (result.truncated ? '. È stato raggiunto il limite massimo di righe.' : '.');
        this.notify(this.searchConsoleMessage + ' Creati/aggiornati ' + result.findings + ' riscontri di possibile cannibalizzazione.');
      } catch (error) { this.notify(error.message, 'error'); }
      return;
    }
    return previousClick.call(this, event);
  };

  window.SeoGrowFeatures = window.SeoGrowFeatures || new Map();
  window.SeoGrowFeatures.set('search-console-api-0.10.21', {version: '0.10.21', features: ['google-oauth-via-wordpress', 'gsc-property-picker', 'gsc-direct-sync', 'query-page-cannibalization', 'project-domain-guard', 'csv-fallback']});
})();
</script>
<script src="agent.js"></script>
