      active.superseded = true;
      if (active.controller && typeof active.controller.abort === 'function') {
        try { active.controller.abort(); } catch (error) {}
      }
    }

    if (this.wordpress && this.wordpress.fingerprint !== normalized.fingerprint) {
      this.cancelWordPressImport();
      this.wordpress = null;
    }

    var controller = typeof AbortController === 'function' ? new AbortController() : null;

      controller: controller,
      superseded: false,
      promise: null

    attempt.promise = (async function () {
      var result;
      try {
        result = await wpRequest(normalized.base, '/wp-json/seogrow/v1/capabilities', {
          method: 'GET',
          headers: normalized.headers,
          signal: controller ? controller.signal : undefined

        if (attempt.superseded || (error && error.name === 'AbortError')) throw supersededError();
        throw error;
      }

      if (attempt.superseded || app.wordpressConnectionAttempt !== attempt) throw supersededError();
      if (!result.response.ok) throw apiError(result.response, result.payload, normalized.base, '/wp-json/seogrow/v1/capabilities');
      if (!result.payload || typeof result.payload !== 'object') {

        id: SeoGrowUtils.id('wp_session'),

        connectedAt: SeoGrowUtils.now(),

      var total = Infinity;
      var guard = 0;

        var result;
        try {
          result = await wpRequest(connection.base, '/wp-json/seogrow/v1/pages?per_page=' + perPage + '&page=' + page + (app.wordpressForceFresh ? '&fresh=1' : ''), {
            method: 'GET',
            headers: connection.headers,
            signal: controller ? controller.signal : undefined
          });
        } catch (error) {
          if (attempt.superseded || (error && error.name === 'AbortError')) throw supersededError();
          throw error;
        }
        if (attempt.superseded || app.wordpress !== connection || app.wordpressImportAttempt !== attempt) throw supersededError();

            url: SeoGrowUtils.safeUrl(row.url) || String(row.url || ''),
            title: row.title || '',
            meta: row.metaDescription || '',
            h1: row.h1 || '',
            canonical: SeoGrowUtils.safeUrl(row.canonical) || '',
            indexability: row.indexability || 'unknown',
            indexabilitySource: row.indexabilitySource || '',
            indexabilityDirective: row.indexabilityDirective || '',
            indexabilityDetail: row.indexabilityDetail || '',
            indexabilityCheckedAt: row.indexabilityCheckedAt || '',

        dataset: {
          id: SeoGrowUtils.id('dataset'),
          projectId: projectId,
          type: 'pages-onpage',
          source: 'WORDPRESS_CONNECTOR',
          importedAt: SeoGrowUtils.now(),
          records: all.length,
          invalid: 0,
          data: all,
          provenance: {pagesFetched: page, site: connection.base}

  };

  function escapeHtml(value) {

  function safeHttpUrl(value) {

  }

  }

  function latestDataset(state, projectId, type) {

  }

  function projectFor(app) {

  }

  function providerInfo(app, state) {

      entityId: '',

   * ------------------------------------------------------------------ */

      function corrupt() {
        return new Error('Lo ZIP sembra danneggiato o incompleto. Scaricalo di nuovo da Search Console oppure estrai e importa i CSV.');
      }

      var eocd = -1;
      var floor = Math.max(0, size - 22 - 65535);
      for (var probe = size - 22; probe >= floor; probe--) {
        if (0x06054b50 === view.getUint32(probe, true)) {
          eocd = probe;
          break;
        }

      if (eocd < 0) throw corrupt();

      var entryCount = view.getUint16(eocd + 10, true);
      var directorySize = view.getUint32(eocd + 12, true);
      var directoryOffset = view.getUint32(eocd + 16, true);

      if (0xffff === entryCount || 0xffffffff === directoryOffset) {

      }
      if (directoryOffset + directorySize > size) throw corrupt();
      if (entryCount > 500) throw new Error('ZIP con troppi file: importa al massimo 20 CSV per volta.');

      var entries = [];
      var cursor = directoryOffset;

        if (cursor + 46 > size || 0x02014b50 !== view.getUint32(cursor, true)) throw corrupt();

        var method = view.getUint16(cursor + 10, true);
        var compressedSize = view.getUint32(cursor + 20, true);
        var nameLength = view.getUint16(cursor + 28, true);
        var extraLength = view.getUint16(cursor + 30, true);
        var commentLength = view.getUint16(cursor + 32, true);
        var localOffset = view.getUint32(cursor + 42, true);
        var nextEntry = cursor + 46 + nameLength + extraLength + commentLength;
        if (nextEntry > size) throw corrupt();

        var name = decoder.decode(new Uint8Array(buffer, cursor + 46, nameLength));
        cursor = nextEntry;

        if (!/\.csv$/i.test(name) || /\/$/.test(name)) continue;
        if (entries.length >= 20) throw new Error('ZIP con troppi file: importa al massimo 20 CSV per volta.');
        if (localOffset + 30 > size) throw corrupt();

        var local = new DataView(buffer, localOffset);
        if (0x04034b50 !== local.getUint32(0, true)) throw corrupt();

        var dataStart = localOffset + 30 + local.getUint16(26, true) + local.getUint16(28, true);
        var dataEnd = dataStart + compressedSize;
        if (dataStart > size || dataEnd > size || dataEnd < dataStart) throw corrupt();

        var bytes = new Uint8Array(buffer, dataStart, compressedSize);
        if (8 === method) {
          if ('function' !== typeof DecompressionStream) {
            throw new Error('Questo browser non supporta l’import ZIP: estrai i CSV e selezionali insieme.');
          }
          try {
            bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
          } catch (error) {
            throw corrupt();
          }
        } else if (0 !== method) {
          throw new Error('ZIP con compressione non supportata: estrai i CSV e selezionali insieme.');
        }

        if (bytes.byteLength > 10485760) throw new Error('Uno dei CSV nello ZIP supera 10 MB. Importalo separatamente.');
        entries.push({name: name, text: decoder.decode(bytes)});
      }

      if (!entries.length) throw new Error('Lo ZIP non contiene file CSV riconoscibili.');
      return entries;
    };

      ['pages', '#pagesFile', 'import CSV pagine'],

        if (matches) { keptHere++; return; }
        row.remove();
        hidden++;
      });
      kept += keptHere;
      if (!keptHere) {
        var body = table.querySelector('tbody');
        var columns = table.querySelectorAll('thead th').length || 4;
        if (body) {
          body.innerHTML = '<tr><td colspan="' + columns + '">Nessuna riga contiene &ldquo;' + esc(term) +

  function sourceLabel(value) {

    if (SOURCE_LABEL[key]) return SOURCE_LABEL[key];
    if (0 === key.indexOf('public_http_')) return 'la pagina pubblica risponde HTTP ' + key.replace('public_http_', '');

  function inconclusive(source) {

  }

  var previousAnalyze = SeoGrowPages.analyze;
  SeoGrowPages.analyze = function (projectId, rows) {
    var byUrl = {};
    (rows || []).forEach(function (row) { if (row && row.url) byUrl[row.url] = row; });

    return previousAnalyze(projectId, rows).map(function (finding) {
      if ('noindex_page' !== finding.type) return finding;

      var row = byUrl[(finding.affectedItems || [])[0]] || {};
      var directive = String(row.indexabilityDirective || '');
      var detail = String(row.indexabilityDetail || '');
      if (!directive) return finding;

      finding.description = 'Direttiva trovata: ' + directive + ' — letta da ' + sourceLabel(row.indexabilitySource) +
        '. Se la pagina risulta comunque indicizzata su Google, controlla che questa direttiva sia ancora presente aprendo il sorgente della pagina.';
      if (finding.evidence && finding.evidence[0]) {
        finding.evidence[0].value = Object.assign({}, finding.evidence[0].value, {
          directive: directive,
          detail: detail
        });
      }
      return finding;
    });

  /*
   * Quando l'ultimo controllo non e' concludente, un vecchio riscontro non puo'
   * continuare a dichiararsi "confermato".
   */
  function downgradeUnverifiedNoindex(app) {
    var state = app.store.getState();
    var projectId = state.activeProjectId;
    var dataset = latest(state, projectId, 'pages-onpage');
    if (!dataset || !Array.isArray(dataset.data)) return 0;

    var byUrl = {};
    dataset.data.forEach(function (row) { if (row && row.url) byUrl[row.url] = row; });

    var changed = 0;
    state.findings.forEach(function (finding) {
      if (finding.projectId !== projectId || 'noindex_page' !== finding.type) return;
      if (CLOSED.indexOf(finding.status) > -1) return;

      var row = byUrl[(finding.affectedItems || [])[0]];
      if (!row || !inconclusive(row.indexabilitySource)) return;
      if (/riverificare/.test(String(finding.title || ''))) return;

      changed++;
      app.store.dispatch({
        type: 'FINDING_UPSERTED',
        projectId: projectId,
        finding: Object.assign({}, finding, {
          title: 'Pagina noindex da riverificare',
          confidence: 60,
          description: 'L’ultimo controllo non ha potuto leggere la pagina pubblica (' + sourceLabel(row.indexabilitySource) +
            '), quindi la direttiva noindex non è più confermata. Usa “Ricontrolla indicizzabilità” prima di intervenire.',
          evidence: (finding.evidence || []).concat([{
            type: 'robots_directive',
            source: 'WORDPRESS_CONNECTOR',
            value: { url: row.url, source: row.indexabilitySource, checkedAt: row.indexabilityCheckedAt || SeoGrowUtils.now() },
            reliability: 'MEDIUM',
            timestamp: SeoGrowUtils.now()
          }])
        })
      });
    });

    return changed;
  }

  function reportRows(state, projectId) {
    return state.findings
      .filter(function (finding) { return finding.projectId === projectId; })
      .sort(function (left, right) {
        var order = { high: 0, medium: 1, low: 2 };
        var bySeverity = (order[left.severity] === undefined ? 1 : order[left.severity]) - (order[right.severity] === undefined ? 1 : order[right.severity]);
        return bySeverity || String(left.type).localeCompare(String(right.type));
      });
  }

  function severityWord(value) {
    return 'high' === value ? 'Alta' : 'low' === value ? 'Bassa' : 'Media';
  }

  function statusWord(value) {
    return String(value || '').replace(/_/g, ' ');
  }

  function buildCsv(state, projectId) {
    var rows = reportRows(state, projectId);
    var header = ['Gravita', 'Tipo', 'Titolo', 'Stato', 'Confidenza', 'URL', 'Descrizione', 'Creato', 'Aggiornato'];
    var lines = [header.join(';')];

    rows.forEach(function (finding) {
      var cells = [
        severityWord(finding.severity),
        finding.type,
        finding.title,
        statusWord(finding.status),
        finding.confidence,
        (finding.affectedItems || []).join(' | '),
        finding.description,
        finding.createdAt,
        finding.updatedAt
      ].map(function (cell) {
        var value = String(cell === undefined || cell === null ? '' : cell).replace(/"/g, '""').replace(/[\r\n]+/g, ' ');
        return '"' + value + '"';
      });
      lines.push(cells.join(';'));
    });

    /* BOM: Excel in italiano apre il file in UTF-8 senza chiedere nulla. */
    return '\uFEFF' + lines.join('\r\n') + '\r\n';
  }

  function tableFrom(headers, rows) {
    if (!rows.length) return '<p class="muted">Nessun dato disponibile.</p>';
    return '<table><thead><tr>' + headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.map(function (cells) {
        return '<tr>' + cells.map(function (cell, index) {
          return '<td' + (index ? '' : '') + '>' + cell + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }

<script>
/* seoGrow 0.10.23 — un solo elenco keyword: Labs, verifiche live e ricerca insieme. */
(function () {
  'use strict';

  if (!window.SeoGrow || !window.SeoGrowApp || !window.SeoGrowUI || window.SeoGrowRelease1023) return;
  window.SeoGrowRelease1023 = true;
  window.SeoGrowFeatures = window.SeoGrowFeatures || new Map();

  var ui = SeoGrowUI.App.prototype;
  var appProto = SeoGrowApp.prototype;

  function esc(value) {
    return SeoGrowUtils.escapeHTML(String(value === undefined || value === null ? '' : value));
  }

  function norm(value) {
    return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
  }

  function num(value) {
    if (value === null || value === undefined || '' === value) return null;
    var parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : null;
  }

  function fmt(value, decimals) {
    var parsed = num(value);
    return null === parsed ? '—' : parsed.toLocaleString('it-IT', { maximumFractionDigits: decimals || 0 });
  }

  function when(value) {
    if (!value) return '—';
    var date = new Date(value);
    return isNaN(date.getTime()) ? String(value) : date.toLocaleDateString('it-IT');
  }

  function shortUrl(value) {
    var url = SeoGrowUtils.safeUrl(value);
    if (!url) return '';
    return url.replace(/^https?:\/\//, '').replace(/\/$/, '');
  }

  function setsOf(state, projectId, type) {
    return state.datasets.filter(function (item) {
      return item.projectId === projectId && item.type === type && Array.isArray(item.data);
    });
  }

  function newest(state, projectId, type) {
    var list = setsOf(state, projectId, type);
    return list.length ? list[list.length - 1] : null;
  }

  function projectOf(state) {
    return state.projects.find(function (item) { return item.id === state.activeProjectId; }) || null;
  }

  /* ------------------------------------------------------------------ *
   * Un solo elenco: posizioni Labs e verifiche live nella stessa tabella.
   *
   * Prima le keyword verificate a mano finivano solo in una tabella a
   * parte, limitata alle ultime 20, e non rientravano mai nell'elenco
   * principale: sembravano perse.
   * ------------------------------------------------------------------ */
  function unifiedKeywords(state, projectId) {
    var index = new Map();

    var labs = newest(state, projectId, 'dataforseo-keyword-positions');
    (labs && labs.data || []).forEach(function (row) {
      var key = norm(row.keyword);
      if (!key) return;
      index.set(key, {
        keyword: row.keyword,
        labsPosition: num(row.position),
        livePosition: null,
        liveAt: null,
        liveDepth: null,
        url: SeoGrowUtils.safeUrl(row.url) || '',
        volume: num(row.searchVolume),
        updatedAt: labs.importedAt
      });
    });

    setsOf(state, projectId, 'dataforseo-keyword-checks').forEach(function (set) {
      var row = set.data[0] || {};
      var key = norm(row.keyword);
      if (!key) return;

      var found = false !== row.found;
      var entry = index.get(key);
      if (!entry) {
        entry = {
          keyword: row.keyword,
          labsPosition: null,
          livePosition: null,
          liveAt: null,
          liveDepth: null,
          url: '',
          volume: null,
          updatedAt: set.importedAt
        };
        index.set(key, entry);
      }

      /* Vince la verifica piu' recente. */
      if (entry.liveAt && new Date(set.importedAt) < new Date(entry.liveAt)) return;
      entry.livePosition = found ? num(row.position) : null;
      entry.liveAt = set.importedAt;
      entry.liveDepth = num(row.depth) || 100;
      entry.liveFound = found;
      if (SeoGrowUtils.safeUrl(row.url)) entry.url = SeoGrowUtils.safeUrl(row.url);
      entry.updatedAt = set.importedAt;
    });

    /* Map.values() e' un iteratore: Array.prototype.slice ne ricava sempre un array vuoto. */
    return Array.from(index.values()).map(function (entry) {
      entry.position = null !== entry.livePosition ? entry.livePosition : entry.labsPosition;
      entry.source = null !== entry.liveAt && null !== entry.labsPosition ? 'Labs + live'
        : null !== entry.liveAt ? 'Verifica live' : 'Labs';
      return entry;
    }).sort(function (left, right) {
      var a = null === left.position ? 9999 : left.position;
      var b = null === right.position ? 9999 : right.position;
      return a - b || String(left.keyword).localeCompare(String(right.keyword));
    });
  }

  /* Pertinenza tematica: resta disponibile, ma come scelta esplicita. */
  function topicalTokens(value) {
    var stop = ['della', 'delle', 'degli', 'dello', 'nella', 'nelle', 'allo', 'alla', 'come', 'cosa', 'sono', 'anche', 'home', 'page', 'https', 'www'];
    return norm(value).split(/[^a-z0-9]+/).filter(function (token) {
      return token.length >= 4 && stop.indexOf(token) < 0 && !/^\d+$/.test(token);
    });
  }

  function vocabularyOf(state, projectId) {
    var words = {};
    var project = projectOf(state);
    topicalTokens(project && project.domain).forEach(function (token) { words[token] = true; });
    var pages = newest(state, projectId, 'pages-onpage');
    (pages && pages.data || []).forEach(function (row) {
      topicalTokens([row.url, row.title, row.h1].join(' ')).forEach(function (token) { words[token] = true; });
    });
    return words;
  }

  function isRelevant(keyword, words) {
    var tokens = topicalTokens(keyword);
    if (!tokens.length) return true;
    return tokens.some(function (token) { return !!words[token]; });

  /* ------------------------------------------------------------------ *
   * Preferenze di vista, per progetto.
   * ------------------------------------------------------------------ */
  function viewPrefs(state, projectId) {
    var saved = state.settings && state.settings.connections && state.settings.connections.keywordView || {};
    var mine = saved[projectId] || {};
    return { onlyRelevant: true === mine.onlyRelevant };
  }

  function setViewPrefs(app, projectId, values) {
    var state = app.store.getState();
    var saved = state.settings.connections.keywordView || {};
    var next = Object.assign({}, saved);
    next[projectId] = Object.assign({}, next[projectId] || {}, values);
    app.store.dispatch({ type: 'CONNECTION_UPDATED', connection: 'keywordView', value: next });
  }

  function searchTerm(state, projectId) {
    var saved = state.settings && state.settings.connections && state.settings.connections.keywordSearch || {};
    return String(saved[projectId] || '').trim();
  }

  function setSearchTerm(app, projectId, value) {
    var state = app.store.getState();
    var saved = state.settings.connections.keywordSearch || {};

  /* ------------------------------------------------------------------ *
   * Tabella unica. La ricerca evidenzia e porta in cima: non nasconde.

  function keywordTable(state, projectId, term) {
    var rows = unifiedKeywords(state, projectId);
    if (!rows.length) {
      return '<p class="muted">Nessuna posizione salvata. Aggiorna le posizioni dal connettore oppure verifica una keyword specifica: comparirà in questo stesso elenco.</p>';
    }

    var words = vocabularyOf(state, projectId);

    var hiddenByRelevance = 0;

    var visible = rows.filter(function (row) {
      row.relevant = isRelevant(row.keyword, words);

      if (row.match) matches++;

        hiddenByRelevance++;
        return false;
      }
      return true;
    });

    /* Le corrispondenze salgono in cima, ma nessuna riga sparisce. */
    if (needle) {
      visible.sort(function (left, right) {
        if (left.match !== right.match) return left.match ? -1 : 1;
        var a = null === left.position ? 9999 : left.position;
        var b = null === right.position ? 9999 : right.position;
        return a - b;
      });
    }

    var body = visible.map(function (row) {
      var page = row.url
        ? '<a href="' + esc(row.url) + '" target="_blank" rel="noopener noreferrer">' + esc(shortUrl(row.url)) + '</a>'
        : '<span class="muted">—</span>';
      var position = null !== row.position
        ? '<span class="position-rank">' + fmt(row.position) + '</span>'
        : '<span class="muted" title="Non trovata nei primi ' + esc(row.liveDepth || 100) + ' risultati">oltre ' + esc(row.liveDepth || 100) + '</span>';
      var badge = 'Verifica live' === row.source ? 'live' : 'Labs + live' === row.source ? 'both' : 'labs';
      var note = row.relevant ? '' : ' <span class="kw-off" title="Non collegata al vocabolario di dominio, title e H1 del progetto">fuori tema</span>';

      return '<tr class="' + (row.match ? 'kw-match' : '') + '"><td>' + position + '</td><td>' + esc(row.keyword) + note +
        '</td><td>' + page + '</td><td>' + fmt(row.volume) + '</td><td><span class="kw-src kw-src-' + badge + '">' + esc(row.source) +
        '</span></td><td>' + esc(when(row.updatedAt)) + '</td></tr>';
    }).join('');

    var summary = '<p class="muted">' + visible.length + ' keyword su ' + rows.length + ' salvate' +

      (hiddenByRelevance ? ' · ' + hiddenByRelevance + ' fuori tema nascoste dal filtro facoltativo' : '') + '.</p>';

    var toggle = '<p><label><input type="checkbox" data-action="toggle-relevance"' + (prefs.onlyRelevant ? ' checked' : '') +
      '> Nascondi le keyword fuori tema</label> <span class="muted"><small>Spento per impostazione predefinita: l’elenco mostra tutto ciò che è stato importato.</small></span></p>';

    return summary + toggle +
      '<div class="keyword-table-wrap"><table class="keyword-table"><thead><tr><th>Pos.</th><th>Keyword</th><th>Pagina</th><th>Volume</th><th>Fonte</th><th>Aggiornata</th></tr></thead><tbody>' +
      body + '</tbody></table></div>';
  }

  function gscTable(state, projectId) {
    var set = newest(state, projectId, 'search-console-queries');
    if (!set) return '<p class="muted">Nessun export Query di Search Console importato in questo progetto.</p>';

    var rows = (set.data || []).map(function (row) {
      var data = row && row.data && 'object' === typeof row.data ? row.data : {};
      var key = Object.keys(data).find(function (name) { return /quer|keyword|parola/i.test(name); });
      var metrics = row.metrics || {};
      return { query: key ? data[key] : '', clicks: num(metrics.clicks), impressions: num(metrics.impressions), position: num(metrics.position) };
    }).filter(function (row) { return row.query; })
      .sort(function (a, b) { return (b.clicks || 0) - (a.clicks || 0) || (b.impressions || 0) - (a.impressions || 0); })
      .slice(0, 500);

    if (!rows.length) return '<p class="muted">L’export importato non contiene query leggibili.</p>';

    var body = rows.map(function (row) {
      return '<tr><td>' + esc(row.query) + '</td><td>' + fmt(row.clicks) + '</td><td>' + fmt(row.impressions) + '</td><td>' + fmt(row.position, 1) + '</td></tr>';
    }).join('');

    return '<p class="muted">' + rows.length + ' query · import del ' + esc(when(set.importedAt)) +
      '. La posizione qui è una <strong>media di periodo</strong>, non una posizione singola: per questo resta in una tabella separata.</p>' +
      '<div class="keyword-table-wrap"><table class="keyword-table seogrow-no-filter"><thead><tr><th>Query</th><th>Clic</th><th>Impressioni</th><th>Posizione media</th></tr></thead><tbody>' +
      body + '</tbody></table></div>';
  }

  function checkHistory(state, projectId) {
    var sets = setsOf(state, projectId, 'dataforseo-keyword-checks').slice().reverse();
    if (!sets.length) return '';

    var body = sets.slice(0, 200).map(function (set) {
      var row = set.data[0] || {};
      var found = false !== row.found;
      var href = SeoGrowUtils.safeUrl(row.url);
      return '<tr><td>' + esc(row.keyword || '—') + '</td><td>' +
        (found ? esc(row.position) : 'oltre ' + esc(row.depth || 100)) + '</td><td>' +
        (href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(shortUrl(href)) + '</a>' : '—') +
        '</td><td>' + esc(when(set.importedAt)) + '</td></tr>';
    }).join('');

    var note = sets.length > 200 ? ' Vengono elencate le 200 più recenti di ' + sets.length + '.' : '';
    return '<section class="card"><h2>Storico verifiche live</h2>' +
      '<p class="muted">Ogni verifica resta registrata con la sua data.' + note +
      ' Le stesse keyword compaiono già nell’elenco principale qui sopra.</p>' +
      '<div class="keyword-table-wrap"><table class="keyword-table seogrow-no-filter"><thead><tr><th>Keyword</th><th>Posizione</th><th>Pagina</th><th>Verificata</th></tr></thead><tbody>' +
      body + '</tbody></table></div></section>';
  }

  function providerReady(app) {
    var capabilities = app.wordpress && app.wordpress.capabilities || {};
    return true === capabilities.dataforseoConfigured && true === capabilities.dataforseoVerified;
  }

  function installStyle() {
    if (typeof document === 'undefined' || document.getElementById('seogrow-v1023-style')) return;
    var style = document.createElement('style');
    style.id = 'seogrow-v1023-style';
    style.textContent =
      '.keyword-table tr.kw-match{background:#eaf6ef;box-shadow:inset 3px 0 var(--green,#146c43)}' +
      '.keyword-table tr.kw-match td{font-weight:600}' +
      '.kw-src{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;letter-spacing:.02em;white-space:nowrap;border:1px solid var(--line,#dce4de)}' +
      '.kw-src-live{background:#e6f4ec;border-color:#9ed3b6;color:#0d5c40}' +
      '.kw-src-both{background:#eef4fb;border-color:#a9c6e4;color:#284c72}' +
      '.kw-off{font-size:11px;color:var(--muted,#617066);border:1px dashed var(--line,#dce4de);border-radius:3px;padding:0 5px;white-space:nowrap}';
    document.head.appendChild(style);
  }

  ui.keywordPositions = function () {
    installStyle();
    var state = this.state();
    var projectId = state.activeProjectId;
    var project = projectOf(state);
    var term = searchTerm(state, projectId);
    var ready = providerReady(this.app);
    var connected = !!this.app.wordpress;

    var update = ready
      ? '<button data-action="dataforseo-import-keyword-positions">Aggiorna posizioni da DataForSEO</button>'

      '<p class="muted">La ricerca <strong>non nasconde niente</strong>: evidenzia le corrispondenze e le porta in cima all’elenco. ' +
      '&ldquo;Verifica posizione live&rdquo; interroga Google tramite DataForSEO, può consumare credito, e la keyword verificata entra nell’elenco qui sotto.</p>' +
      '<label for="keywordExactSearch">Keyword</label>' +
      '<input id="keywordExactSearch" type="search" value="' + esc(term) + '" placeholder="es. yoga cinisello balsamo">' +
      '<div class="actions"><button class="primary" data-action="keyword-search">Evidenzia nell’elenco</button>' +
      '<button data-action="keyword-check-live">Verifica posizione live</button>' +
      (term ? '<button data-action="keyword-search-clear">Azzera evidenziazione</button>' : '') + '</div></section>';

    return '<h1>Posizioni keyword</h1>' +
      '<p class="muted">Un solo elenco per ' + esc(project ? project.domain : 'nessun progetto') +
      ': posizioni dal database DataForSEO Labs e verifiche live, insieme. Nessuna keyword viene rimossa.</p>' +
      search +
      '<section class="card keyword-position-card"><h2>Elenco keyword posizionate</h2>' +
      keywordTable(state, projectId, term) +
      '<p><small>Labs è un database aggiornato periodicamente, non una SERP live; una verifica live è una lettura puntuale del momento. Quando entrambe esistono, l’elenco mostra la verifica live perché è la più recente.</small></p>' +
      '<div class="actions">' + update + '</div></section>' +
      checkHistory(state, projectId) +
      '<section class="card"><h2>Query reali da Search Console</h2>' + gscTable(state, projectId) +
      '<div class="actions"><button data-view="gsc">Importa o aggiorna Search Console</button></div></section>';
  };

  /* ------------------------------------------------------------------ *
   * Azioni della vista.
   * ------------------------------------------------------------------ */
  var previousClick = ui.click;
  ui.click = async function (event) {
    var element = event.target.closest('[data-action],[data-view]');
    var action = element && element.dataset.action;

    if ('toggle-relevance' === action) {
      setViewPrefs(this.app, this.state().activeProjectId, { onlyRelevant: !!element.checked });
      return;
    }

    if ('keyword-search' === action) {
      var field = document.getElementById('keywordExactSearch');
      setSearchTerm(this.app, this.state().activeProjectId, field ? field.value : '');
      return;
    }

    if ('keyword-search-clear' === action) {
      setSearchTerm(this.app, this.state().activeProjectId, '');
      return;
    }

    return previousClick.call(this, event);
  };

  /* Dopo una verifica live la keyword deve essere subito nell'elenco. */
  var previousCheck = appProto.checkDataForSeoKeyword;
  appProto.checkDataForSeoKeyword = async function (keyword) {
    var result = await previousCheck.call(this, keyword);
    if (result && !result.cancelled) await this.flushSave();
    return result;
  };

  window.SeoGrowFeatures.set('release-0.10.23', {
    version: '0.10.23',
    features: [
      'unified-keyword-list',
      'live-checks-in-main-list',
      'search-highlights-instead-of-hiding',
      'relevance-filter-opt-in',
      'full-check-history'
    ]
  });
})();

<script>
/* seoGrow 0.10.24 — rianalisi dei riscontri, azzeramento degli stati e vista per gruppi. */
(function () {
  'use strict';

  if (!window.SeoGrow || !window.SeoGrowApp || !window.SeoGrowUI || window.SeoGrowRelease1024) return;
  window.SeoGrowRelease1024 = true;
  window.SeoGrowFeatures = window.SeoGrowFeatures || new Map();

  var ui = SeoGrowUI.App.prototype;
  var appProto = SeoGrowApp.prototype;

  var OPEN_TASK_STATES = ['verified', 'archived', 'obsolete'];

  /* Tipi di riscontro che la rianalisi sa ricostruire, con il dataset che li genera. */
  var MANAGED = {
    missing_title: 'pages-onpage',
    missing_meta_description: 'pages-onpage',
    missing_h1: 'pages-onpage',
    noindex_page: 'pages-onpage',
    canonical_other_url: 'pages-onpage',
    duplicate_title: 'pages-onpage',
    broken_internal_link: 'internal-links',
    competitor_keyword_gap: 'competitor-positions'
  };

  function esc(value) {
    return SeoGrowUtils.escapeHTML(String(value === undefined || value === null ? '' : value));
  }

  function projectOf(state) {
    return state.projects.find(function (item) { return item.id === state.activeProjectId; }) || null;
  }

  function newest(state, projectId, type) {
    var list = state.datasets.filter(function (item) {
      return item.projectId === projectId && item.type === type && Array.isArray(item.data);
    });
    return list.length ? list[list.length - 1] : null;
  }

  /* ------------------------------------------------------------------ *
   * Rianalisi: ricostruisce i riscontri dagli ultimi dati importati,
   * senza dover reimportare nulla.
   * ------------------------------------------------------------------ */
  function freshCandidates(state, projectId) {
    var project = projectOf(state);
    var out = [];
    var used = [];

    var pages = newest(state, projectId, 'pages-onpage');
    if (pages) {
      out = out.concat(SeoGrowPages.analyze(projectId, pages.data || []));
      used.push('pages-onpage');
    }

    var links = newest(state, projectId, 'internal-links');
    if (links) {
      out = out.concat(SeoGrowTechnical.analyzeBrokenLinks(projectId, links.data || []));
      used.push('internal-links');
    }

    var competitors = newest(state, projectId, 'competitor-positions');
    if (competitors && project && window.SeoGrowCompetitors && SeoGrowCompetitors.gaps) {
      out = out.concat(SeoGrowCompetitors.gaps(projectId, project.domain, competitors.data || []));
      used.push('competitor-positions');
    }

    return { candidates: out, datasets: used, pages: pages, links: links, competitors: competitors };
  }

  function conclusiveIndex(row) {
    if (!row) return false;
    if ('index' !== String(row.indexability || '').toLowerCase()) return false;
    var source = String(row.indexabilitySource || '');
    return !source || 'public_html_no_noindex' === source;
  }

  function obsoleteTask(next, finding) {
    var task = next.tasks.find(function (item) {
      return item.findingId === finding.id && OPEN_TASK_STATES.indexOf(item.status) < 0;
    });
    if (task) {
      task.status = 'obsolete';
      task.updatedAt = SeoGrowUtils.now();
    }
  }

  appProto.reanalyzeFindings = async function () {
    var state = this.store.getState();
    var projectId = state.activeProjectId;
    var fresh = freshCandidates(state, projectId);

    if (!fresh.datasets.length) {
      throw new Error('Non ci sono dati su cui rianalizzare. Importa prima le pagine, un crawl di link interni o un CSV competitor.');
    }

    await this.storage.saveSnapshot(state);

    /* 1. Riscontri ancora presenti: aggiornati, e quelli chiusi tornano da confermare. */
    var created = this.findings.createMany(fresh.candidates);
    var active = {};
    fresh.candidates.forEach(function (item) { active[item.signature] = true; });

    /* 2. Riscontri non piu' riprodotti: chiusi, ma solo dove ci sono le prove. */
    var after = this.store.getState();
    var rowByUrl = {};
    (fresh.pages && fresh.pages.data || []).forEach(function (row) { if (row && row.url) rowByUrl[row.url] = row; });

    var toClose = after.findings.filter(function (finding) {
      if (finding.projectId !== projectId) return false;
      if (['excluded', 'resolved', 'obsolete'].indexOf(finding.status) > -1) return false;
      var dataset = MANAGED[finding.type];
      if (!dataset || fresh.datasets.indexOf(dataset) < 0) return false;
      if (active[finding.signature]) return false;

      if ('pages-onpage' === dataset) {
        var urls = Array.isArray(finding.affectedItems) ? finding.affectedItems : [];
        /* Senza la pagina nell'ultimo import non si puo' dire nulla: si lascia stare. */
        if (!urls.length || !urls.every(function (url) { return !!rowByUrl[url]; })) return false;
        if ('noindex_page' === finding.type && !urls.every(function (url) { return conclusiveIndex(rowByUrl[url]); })) return false;
      }
      return true;
    });

    if (toClose.length) {
      var next = SeoGrowUtils.clone(after);
      var now = SeoGrowUtils.now();
      toClose.forEach(function (finding) {
        var target = next.findings.find(function (item) { return item.id === finding.id; });
        if (!target) return;
        target.status = ['candidate', 'reopened'].indexOf(target.status) > -1 ? 'excluded' : 'resolved';
        target.updatedAt = now;
        target.description = 'Non riprodotto nella rianalisi degli ultimi dati importati.';
        target.evidence = (target.evidence || []).concat([{
          type: 'recheck',
          source: 'LATEST_IMPORT',
          value: { result: 'not_reproduced', at: now },
          reliability: 'CONFIRMED',
          timestamp: now
        }]);
        obsoleteTask(next, target);
      });
      next.history.push({
        id: SeoGrowUtils.id('history'),
        projectId: projectId,
        entityType: 'finding',
        entityId: '',
        action: 'FINDINGS_REANALYZED',
        timestamp: now,
        metadata: { updated: created.length, closed: toClose.length }
      });
      this.store.replace(next, { source: 'findings:reanalyze' });
    }

    await this.flushSave();
    return { updated: created.length, closed: toClose.length, datasets: fresh.datasets };
  };

  /* ------------------------------------------------------------------ *
   * Azzeramento: tutti i riscontri tornano "da confermare".
   * ------------------------------------------------------------------ */
  appProto.resetFindingStates = async function () {
    var state = this.store.getState();
    var projectId = state.activeProjectId;
    var mine = state.findings.filter(function (item) { return item.projectId === projectId; });
    if (!mine.length) throw new Error('Non ci sono riscontri da azzerare in questo progetto.');

    await this.storage.saveSnapshot(state);

    var next = SeoGrowUtils.clone(state);
    var now = SeoGrowUtils.now();
    var reset = 0;
    var closedTasks = 0;

    next.findings.forEach(function (finding) {
      if (finding.projectId !== projectId || 'candidate' === finding.status) return;
      finding.status = 'candidate';
      finding.updatedAt = now;
      reset++;
      var task = next.tasks.find(function (item) {
        return item.findingId === finding.id && OPEN_TASK_STATES.indexOf(item.status) < 0;
      });
      if (task) {
        task.status = 'obsolete';
        task.updatedAt = now;
        closedTasks++;
      }
    });

    next.history.push({
      id: SeoGrowUtils.id('history'),
      projectId: projectId,
      entityType: 'finding',
      entityId: '',
      action: 'FINDING_STATES_RESET',
      timestamp: now,
      metadata: { reset: reset, obsoleteTasks: closedTasks }
    });

    this.store.replace(next, { source: 'findings:reset' });
    await this.flushSave();
    return { reset: reset, obsoleteTasks: closedTasks };
  };

  /* ------------------------------------------------------------------ *
   * Vista Riscontri divisa in gruppi.
   *
   * Le schede vengono generate dal livello precedente e qui solo
   * ridistribuite: evidenze, link e passo successivo restano identici.
   * ------------------------------------------------------------------ */
  var GROUPS = [
    { key: 'review', title: 'Da confermare', states: ['candidate', 'reopened'],
      hint: 'Controlla l’evidenza e decidi: confermare apre la strada a un’attività, escludere lo toglie dai conteggi.' },
    { key: 'working', title: 'Confermati e in lavorazione', states: ['validated', 'task_created'],
      hint: 'Riscontri presi in carico. Quando l’attività collegata viene verificata, il riscontro si chiude da solo.' },
    { key: 'closed', title: 'Chiusi', states: ['resolved', 'obsolete', 'insufficient_data'],
      hint: 'Risolti o non più riproducibili nell’ultimo import.' },
    { key: 'excluded', title: 'Esclusi', states: ['excluded'],
      hint: 'Scartati manualmente. Non entrano nei conteggi, ma restano qui: puoi rimetterli fra quelli da confermare quando vuoi.' }
  ];

  function toolbar(state, projectId) {
    var counts = { total: 0, review: 0, excluded: 0 };
    state.findings.forEach(function (finding) {
      if (finding.projectId !== projectId) return;
      counts.total++;
      if (['candidate', 'reopened'].indexOf(finding.status) > -1) counts.review++;
      if ('excluded' === finding.status) counts.excluded++;
    });

    return '<section class="card findings-toolbar"><h2>Gestione dei riscontri</h2>' +
      '<p class="muted">' + counts.total + ' riscontri nel progetto · ' + counts.review + ' da confermare · ' + counts.excluded + ' esclusi.</p>' +
      '<div class="actions">' +
      '<button data-action="reanalyze-findings">Rianalizza dai dati importati</button>' +
      '<button data-action="reset-findings">Azzera tutti gli stati</button>' +
      (counts.excluded ? '<button data-action="unexclude-all">Rimetti gli esclusi fra i da confermare</button>' : '') +
      '</div>' +
      '<p><small><strong>Rianalizza</strong> ricostruisce i riscontri dagli ultimi dati già importati, senza chiamate al sito né a DataForSEO: ' +
      'chiude quelli non più riprodotti e riporta fra i da confermare quelli esclusi che invece sono ancora presenti. ' +
      '<strong>Azzera</strong> riporta ogni riscontro a “da confermare” e rende obsolete le attività collegate. ' +
      'Prima di entrambe viene salvato uno snapshot: puoi tornare indietro da Integrità e backup.</small></p></section>';
  }

  function installStyle() {
    if (typeof document === 'undefined' || document.getElementById('seogrow-v1024-style')) return;
    var style = document.createElement('style');
    style.id = 'seogrow-v1024-style';
    style.textContent =
      '.findings-toolbar{border-left:4px solid #5bd28e}' +
      '.findings-group{margin-bottom:18px}' +
      '.findings-group>h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}' +
      '.findings-group .count{font-size:13px;font-weight:600;color:var(--muted,#617066);border:1px solid var(--line,#dce4de);border-radius:20px;padding:1px 10px}' +
      '.findings-group.is-empty>p.muted{margin-bottom:0}' +
      '.findings-group .finding-row{border-top:1px solid var(--line,#dce4de);padding-top:14px;margin-top:14px}' +
      '.findings-group .finding-row:first-of-type{border-top:0;padding-top:0;margin-top:8px}';
    document.head.appendChild(style);
  }

  var previousFindings = ui.findings;
  ui.findings = function () {
    installStyle();
    var state = this.state();
    var projectId = state.activeProjectId;
    var bar = toolbar(state, projectId);
    var html = previousFindings.call(this);

    if (typeof document === 'undefined') return bar + html;

    var box = document.createElement('div');
    box.innerHTML = html;
    var cards = box.querySelectorAll('article.finding-row');
    if (!cards.length) return bar + html;

    var statusById = {};
    state.findings.forEach(function (finding) {
      if (finding.projectId === projectId) statusById[finding.id] = finding.status;
    });

    var buckets = {};
    GROUPS.forEach(function (group) { buckets[group.key] = []; });

    Array.prototype.forEach.call(cards, function (card) {
      var id = String(card.id || '').replace(/^finding-/, '');
      var status = statusById[id] || 'candidate';
      var group = GROUPS.find(function (item) { return item.states.indexOf(status) > -1; }) || GROUPS[0];

      if ('excluded' === group.key) {
        var actions = card.querySelector('.finding-actions .actions') || card.querySelector('.actions');
        if (actions && !actions.querySelector('[data-action="unexclude"]')) {
          var button = document.createElement('button');
          button.className = 'primary';
          button.setAttribute('data-action', 'unexclude');
          button.setAttribute('data-id', id);
          button.textContent = 'Rimetti fra i da confermare';
          actions.appendChild(button);
        }
      }

      buckets[group.key].push(card.outerHTML);
    });

    var heading = box.querySelector('h1');
    var intro = heading && heading.nextElementSibling && 'P' === heading.nextElementSibling.tagName ? heading.nextElementSibling.outerHTML : '';

    var sections = GROUPS.map(function (group) {
      var items = buckets[group.key];
      if (!items.length && 'excluded' !== group.key && 'review' !== group.key) return '';
      return '<section class="card findings-group' + (items.length ? '' : ' is-empty') + '" data-group="' + esc(group.key) + '">' +
        '<h2>' + esc(group.title) + ' <span class="count">' + items.length + '</span></h2>' +
        '<p class="muted">' + group.hint + '</p>' +
        (items.length ? items.join('') : '<div class="empty">Nessun riscontro in questo gruppo.</div>') +
        '</section>';
    }).join('');

    return (heading ? heading.outerHTML : '<h1>Riscontri</h1>') + intro + bar + sections;
  };

  /* ------------------------------------------------------------------ *
   * Azioni.
   * ------------------------------------------------------------------ */
  var previousClick = ui.click;
  ui.click = async function (event) {
    var element = event.target.closest('[data-action],[data-view]');
    var action = element && element.dataset.action;

    if ('unexclude' === action) {
      try {
        /* "reopened" e' lo stato di rientro previsto dalla macchina a stati. */
        this.app.findings.status(element.dataset.id, 'reopened');
        await this.app.flushSave();
        this.notify('Riscontro rimesso fra quelli da confermare.');
      } catch (error) {
        this.notify(error.message, 'error');
      }
      return;
    }

    if ('unexclude-all' === action) {
      var state = this.state();
      var excluded = state.findings.filter(function (item) {
        return item.projectId === state.activeProjectId && 'excluded' === item.status;
      });
      if (!excluded.length) return;
      if (!confirm('Rimettere ' + excluded.length + ' riscontri esclusi fra quelli da confermare?')) return;
      var moved = 0;
      var self = this;
      excluded.forEach(function (finding) {
        try { self.app.findings.status(finding.id, 'reopened'); moved++; } catch (error) { /* stato non compatibile */ }
      });
      await this.app.flushSave();
      this.notify(moved + ' riscontri rimessi fra quelli da confermare.');
      return;
    }

    if ('reanalyze-findings' === action) {
      if (element.disabled) return;
      if (!confirm('Rianalizzare i riscontri dagli ultimi dati importati? Viene prima salvato uno snapshot locale.')) return;
      element.disabled = true;
      var reanalyzeLabel = element.textContent;
      element.textContent = 'Rianalisi in corso…';
      try {
        var result = await this.app.reanalyzeFindings();
        this.notify('Rianalisi completata su ' + result.datasets.join(', ') + ': ' + result.updated +
          ' riscontri aggiornati, ' + result.closed + ' chiusi perché non più riprodotti.');
      } catch (error) {
        this.notify(error.message, 'error');
      } finally {
        if (element.isConnected) {
          element.disabled = false;
          element.textContent = reanalyzeLabel;
        }
      }
      return;
    }

    if ('reset-findings' === action) {
      if (element.disabled) return;
      if (!confirm('Riportare tutti i riscontri a “da confermare”? Le attività collegate ancora aperte diventeranno obsolete. Viene prima salvato uno snapshot locale.')) return;
      element.disabled = true;
      try {
        var reset = await this.app.resetFindingStates();
        this.notify(reset.reset + ' riscontri riportati a “da confermare”' +
          (reset.obsoleteTasks ? ' · ' + reset.obsoleteTasks + ' attività rese obsolete' : '') + '.');
      } catch (error) {
        this.notify(error.message, 'error');
      } finally {
        if (element.isConnected) element.disabled = false;
      }
      return;
    }

    return previousClick.call(this, event);
  };

  window.SeoGrowFeatures.set('release-0.10.24', {
    version: '0.10.24',
    features: [
      'reanalyze-from-imported-data',
      'reset-finding-states',
      'grouped-findings-view',
      'excluded-list-with-restore'
    ]
  });
})();
</script>
<script>
/* seoGrow 0.10.25 — collegamento WordPress: campi che non si svuotano, URL tollerante e diagnostica. */
(function () {
  'use strict';

  if (!window.SeoGrow || !window.SeoGrowApp || !window.SeoGrowUI || window.SeoGrowRelease1025) return;
  window.SeoGrowRelease1025 = true;
  window.SeoGrowFeatures = window.SeoGrowFeatures || new Map();

  var ui = SeoGrowUI.App.prototype;
  var appProto = SeoGrowApp.prototype;

  /* Solo in memoria: mai nello stato, mai nel backup, mai in sessionStorage. */
  var secrets = { wpToken: '', wpPassword: '' };

  function esc(value) {
    return SeoGrowUtils.escapeHTML(String(value === undefined || value === null ? '' : value));
  }

  /* ------------------------------------------------------------------ *
   * 1. La chiave non deve piu' sparire dal campo.
   *
   * render() riscrive tutto l'HTML e chiave e password applicazione, che
   * per sicurezza non entrano nella bozza salvata, tornavano vuote: si
   * premeva "Collega" con i campi ormai azzerati e il messaggio d'errore
   * parlava d'altro.
   * ------------------------------------------------------------------ */
  function captureSecrets() {
    if (typeof document === 'undefined') return;
    Object.keys(secrets).forEach(function (id) {
      var field = document.getElementById(id);
      if (field) secrets[id] = field.value;
    });
  }

  function restoreSecrets() {
    if (typeof document === 'undefined') return;
    Object.keys(secrets).forEach(function (id) {
      if (!secrets[id]) return;
      var field = document.getElementById(id);
      if (field && !field.value) field.value = secrets[id];
    });
  }

  function clearSecrets() {
    secrets.wpToken = '';
    secrets.wpPassword = '';
    if (typeof document === 'undefined') return;
    Object.keys(secrets).forEach(function (id) {
      var field = document.getElementById(id);
      if (field) field.value = '';
    });
  }

  var previousRender = ui.render;
  ui.render = function () {
    captureSecrets();
    var result = previousRender.call(this);
    restoreSecrets();
    return result;
  };

  var previousMount = ui.mount;
  ui.mount = function (root) {
    var result = previousMount.call(this, root);
    root.addEventListener('input', function (event) {
      var field = event.target;
      if (field && Object.prototype.hasOwnProperty.call(secrets, field.id)) secrets[field.id] = field.value;
    });
    return result;
  };

  /* ------------------------------------------------------------------ *
   * 2. URL del sito tollerante.
   *
   * "miosito.it" e "https://miosito.it/wp-admin/" sono quello che la gente
   * incolla davvero; il secondo mandava le richieste su /wp-admin/wp-json/
   * e rispondeva 404.
   * ------------------------------------------------------------------ */
  function cleanSiteUrl(value) {
    var raw = String(value || '').trim();
    if (!raw) return raw;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(raw)) raw = 'https://' + raw.replace(/^\/+/, '');

    var url;
    try {
      url = new URL(raw);
    } catch (error) {
      return String(value).trim();
    }

    url.search = '';
    url.hash = '';
    url.pathname = String(url.pathname || '/')
      .replace(/\/wp-admin(\/.*)?$/i, '/')
      .replace(/\/wp-login\.php.*$/i, '/')
      .replace(/\/wp-json(\/.*)?$/i, '/')
      .replace(/\/index\.php.*$/i, '/');

    return url.href.replace(/\/+$/, '');
  }

  SeoGrowUtils.cleanSiteUrl = cleanSiteUrl;

  function withCleanSite(credentials) {
    if (!credentials || !credentials.site) return credentials;
    return Object.assign({}, credentials, { site: cleanSiteUrl(credentials.site) });
  }

  var previousConnect = appProto.connectWordPress;
  appProto.connectWordPress = async function (credentials) {
    return previousConnect.call(this, withCleanSite(credentials));
  };

  var previousImport = appProto.importWordPressPages;
  appProto.importWordPressPages = async function (credentials) {
    var result = await previousImport.call(this, withCleanSite(credentials));
    clearSecrets();
    return result;
  };

  var previousDisconnect = appProto.disconnectWordPress;
  appProto.disconnectWordPress = function () {
    clearSecrets();
    return previousDisconnect.call(this);
  };

  /* ------------------------------------------------------------------ *
   * 3. Diagnostica: dire esattamente dove si rompe.
   * ------------------------------------------------------------------ */
  async function probe(url, headers) {
    var started = Date.now();
    try {
      var response = await fetch(url, {
        method: 'GET',
        mode: 'cors',
        credentials: 'omit',
        headers: Object.assign({ Accept: 'application/json' }, headers || {})
      });
      var body = '';
      try { body = (await response.text()).slice(0, 400); } catch (error) { body = ''; }
      return { reached: true, status: response.status, ok: response.ok, body: body, ms: Date.now() - started };
    } catch (error) {
      return { reached: false, status: 0, ok: false, error: String(error && error.message || error), ms: Date.now() - started };
    }
  }

  appProto.diagnoseWordPress = async function (credentials) {
    var steps = [];
    var input = credentials || {};
    var site = cleanSiteUrl(input.site);
    var token = String(input.token || '').trim();
    var username = String(input.username || '').trim();
    var password = String(input.password || '').replace(/\s/g, '');

    /* Passo 1: da dove e' aperta l'app. */
    var origin = typeof location === 'undefined' ? '' : location.origin;
    var isFile = typeof location !== 'undefined' && 'file:' === location.protocol;
    var localhost = /^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:|$)/i.test(origin);
    steps.push({
      label: 'Origine della web app',
      ok: !isFile && (localhost || /^https:/i.test(origin)),
      detail: isFile ? 'file:// — origine "null"' : origin,
      hint: isFile
        ? 'Apri seoGrow da un indirizzo HTTPS o da localhost: con file:// il browser invia un’origine null che WordPress rifiuta sempre.'
        : 'Questa esatta stringa deve comparire in WordPress → Impostazioni → RZ seoGrow Connector → Origini autorizzate.'
    });

    /* Passo 2: URL del sito. */
    var validSite = /^https:\/\//i.test(site);
    steps.push({
      label: 'URL del sito WordPress',
      ok: validSite,
      detail: site || '(vuoto)',
      hint: validSite
        ? (site === String(input.site || '').trim() ? 'Formato corretto.' : 'Corretto automaticamente da “' + String(input.site || '').trim() + '”.')
        : 'Serve l’indirizzo pubblico del sito in HTTPS, senza /wp-admin.'
    });
    if (!validSite) return { site: site, steps: steps };

    /* Passo 3: il REST di WordPress risponde? */
    var rest = await probe(site + '/wp-json/');
    var restRoute = null;
    if (!rest.reached || 404 === rest.status) restRoute = await probe(site + '/?rest_route=/');
    steps.push({
      label: 'API REST di WordPress',
      ok: rest.reached && rest.ok,
      detail: rest.reached ? 'HTTP ' + rest.status + ' su /wp-json/' : 'nessuna risposta leggibile dal browser',
      hint: rest.reached && rest.ok
        ? 'Raggiungibile.'
        : (restRoute && restRoute.ok
          ? 'Il sito risponde su ?rest_route= ma non su /wp-json/: i permalink sono impostati su “Semplice”. Cambiali in Impostazioni → Permalink e riprova.'
          : (rest.reached
            ? 'WordPress risponde ' + rest.status + ' sul suo stesso REST: un plugin di sicurezza o il server sta bloccando /wp-json/.'
            : 'Il browser non riesce a leggere la risposta. È quasi sempre CORS: l’origine qui sopra non è fra quelle autorizzate nel plugin. Verifica anche che l’URL sia giusto e il sito online.'))
    });

    /* Passo 4: la rotta del connettore esiste e il CORS lascia leggere la risposta? */
    var anonymous = await probe(site + '/wp-json/seogrow/v1/capabilities');
    steps.push({
      label: 'Rotta del connettore (senza credenziali)',
      ok: anonymous.reached && (401 === anonymous.status || 403 === anonymous.status || anonymous.ok),
      detail: anonymous.reached ? 'HTTP ' + anonymous.status : 'nessuna risposta leggibile',
      hint: !anonymous.reached
        ? 'Il browser non legge la risposta: preflight CORS bloccato. Aggiungi ' + (origin || 'l’origine di questa pagina') + ' alle Origini autorizzate del plugin e salva.'
        : 404 === anonymous.status
          ? 'Il plugin RZ seoGrow Connector non è attivo su questo sito, oppure è una versione senza questa rotta.'
          : (401 === anonymous.status || 403 === anonymous.status)
            ? 'Corretto: la rotta esiste, risponde e il CORS funziona. Manca solo l’autenticazione.'
            : 'Risposta inattesa: ' + anonymous.status + '.'
    });

    /* Passo 5: le credenziali. */
    if (!token && (!username || !password)) {
      steps.push({
        label: 'Credenziali',
        ok: false,
        detail: 'nessuna credenziale inserita',
        hint: 'Incolla la chiave seoGrow dal plugin, oppure utente WordPress e Password applicazione.'
      });
      return { site: site, steps: steps };
    }

    var headers = token
      ? { 'X-SeoGrow-Token': token }
      : { Authorization: 'Basic ' + SeoGrowUtils.base64Utf8(username + ':' + password) };
    var authed = await probe(site + '/wp-json/seogrow/v1/capabilities', headers);
    var payload = null;
    try { payload = authed.body ? JSON.parse(authed.body) : null; } catch (error) { payload = null; }

    steps.push({
      label: token ? 'Chiave seoGrow' : 'Utente e Password applicazione',
      ok: authed.reached && authed.ok,
      detail: authed.reached ? 'HTTP ' + authed.status + (payload && payload.version ? ' · connettore ' + payload.version : '') : 'nessuna risposta leggibile',
      hint: authed.reached && authed.ok
        ? 'Collegamento riuscito: puoi premere “Collega e importa”.'
        : 401 === authed.status || 403 === authed.status
          ? (token
            ? 'La chiave non corrisponde. Riaprila da WordPress → Impostazioni → RZ seoGrow Connector e ricopiala per intero, senza spazi.'
            : 'Utente o Password applicazione rifiutati. La Password applicazione si genera dal profilo utente di WordPress e non è la password di accesso.')
          : 'Risposta inattesa: ' + (authed.reached ? 'HTTP ' + authed.status : authed.error)
    });

    return { site: site, steps: steps, capabilities: payload };
  };

  /* ------------------------------------------------------------------ *
   * 4. Interfaccia della diagnostica.
   * ------------------------------------------------------------------ */
  function installStyle() {
    if (typeof document === 'undefined' || document.getElementById('seogrow-v1025-style')) return;
    var style = document.createElement('style');
    style.id = 'seogrow-v1025-style';
    style.textContent =
      '.wp-diagnostics{border-left:4px solid #5bd28e}' +
      '.wp-diagnostics ol{margin:12px 0 0;padding-left:0;list-style:none}' +
      '.wp-diagnostics li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line,#dce4de)}' +
      '.wp-diagnostics li:first-child{border-top:0}' +
      '.wp-diagnostics .mark{font-weight:700;line-height:1.4}' +
      '.wp-diagnostics .mark.yes{color:#146c43}.wp-diagnostics .mark.no{color:#a13232}' +
      '.wp-diagnostics b{display:block}' +
      '.wp-diagnostics code{overflow-wrap:anywhere}' +
      '.wp-diagnostics p{margin:2px 0 0}';
    document.head.appendChild(style);
  }

  function diagnosticsCard(report) {
    if (!report) {
      return '<section class="card wp-diagnostics"><h2>Il collegamento non riesce?</h2>' +
        '<p class="muted">La verifica prova il sito passo per passo — origine, API REST, rotta del connettore, credenziali — e dice esattamente quale passaggio si rompe. Non importa nulla e non consuma credito.</p>' +
        '<div class="actions"><button data-action="wp-diagnose">Verifica connessione</button></div></section>';
    }

    var items = report.steps.map(function (step) {
      return '<li><span class="mark ' + (step.ok ? 'yes' : 'no') + '">' + (step.ok ? '✓' : '✕') + '</span><div>' +
        '<b>' + esc(step.label) + '</b>' +
        '<p><code>' + esc(step.detail) + '</code></p>' +
        '<p class="muted">' + esc(step.hint) + '</p></div></li>';
    }).join('');

    var failed = report.steps.filter(function (step) { return !step.ok; });
    var verdict = failed.length
      ? '<p class="status candidate">Si ferma qui: ' + esc(failed[0].label) + '</p>'
      : '<p class="status verified">Tutti i controlli superati</p>';

    return '<section class="card wp-diagnostics"><h2>Verifica della connessione</h2>' + verdict +
      '<ol>' + items + '</ol>' +
      '<div class="actions"><button data-action="wp-diagnose">Ripeti la verifica</button>' +
      '<button data-action="wp-diagnose-clear">Chiudi</button></div></section>';
  }

  var previousPages = ui.pages;
  ui.pages = function () {
    installStyle();
    return previousPages.call(this) + diagnosticsCard(this.__wpDiagnostics);
  };

  function readForm() {
    function value(id) {
      var field = typeof document === 'undefined' ? null : document.getElementById(id);
      return field ? field.value : '';
    }
    return {
      site: value('wpSite'),
      token: value('wpToken') || secrets.wpToken,
      username: value('wpUsername'),
      password: value('wpPassword') || secrets.wpPassword
    };
  }

  var previousClick = ui.click;
  ui.click = async function (event) {
    var element = event.target.closest('[data-action],[data-view]');
    var action = element && element.dataset.action;

    if ('wp-diagnose' === action) {
      if (element.disabled) return;
      captureSecrets();
      var credentials = readForm();
      if (!credentials.site) {
        this.notify('Inserisci prima l’URL del sito WordPress, poi premi “Verifica connessione”.', 'error');
        return;
      }
      element.disabled = true;
      var label = element.textContent;
      element.textContent = 'Verifica in corso…';
      try {
        this.__wpDiagnostics = await this.app.diagnoseWordPress(credentials);
        this.render();
      } catch (error) {
        this.notify('La verifica non è riuscita: ' + error.message, 'error');
      } finally {
        if (element.isConnected) {
          element.disabled = false;
          element.textContent = label;
        }
      }
      return;
    }

    if ('wp-diagnose-clear' === action) {
      this.__wpDiagnostics = null;
      this.render();
      return;
    }

    return previousClick.call(this, event);
  };

  window.SeoGrowFeatures.set('release-0.10.25', {
    version: '0.10.25',
    features: [
      'secret-fields-survive-render',
      'tolerant-site-url',
      'connection-diagnostics'
    ]
  });
})();
</script>
</body></html>
