</style></head><body><div id="app"></div><script>window.SeoGrowModules = window.SeoGrowModules || {};

</script><script>window.SeoGrowUtils = window.SeoGrowUtils || {};
SeoGrowUtils.id = prefix => `${prefix}_${crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(36).slice(2)}`}`;

</script><script>window.SeoGrowCore = window.SeoGrowCore || {};
SeoGrowCore.EventBus = class { constructor(){ this.events = new Map(); this.recent = []; }
  on(name, handler){ if(!this.events.has(name)) this.events.set(name,new Set()); this.events.get(name).add(handler); return () => this.off(name,handler); }
  once(name, handler){ const off=this.on(name,p=>{off();handler(p)}); return off; }

  emit(name,payload={}){ this.recent.unshift({name,at:SeoGrowUtils.now(),payload}); this.recent=this.recent.slice(0,50); (this.events.get(name)||[]).forEach(fn=>{try{fn(payload)}catch(error){console.error('[seoGrow]',name,error)}}); }

</script><script>SeoGrowCore.Logger = class { constructor(){this.items=[]} log(level,module,action,context={}){this.items.unshift({level,module,action,context,at:SeoGrowUtils.now()});this.items=this.items.slice(0,200)} debug(m,a,c){this.log('debug',m,a,c)} info(m,a,c){this.log('info',m,a,c)} warn(m,a,c){this.log('warn',m,a,c)} error(m,a,c){this.log('error',m,a,c)} };
</script><script>SeoGrowCore.migrate = raw => { const state=SeoGrowUtils.clone(raw || {}); const version=Number(state.schemaVersion || 1); if(version < 2){ state.history=Array.isArray(state.history)?state.history:[]; state.datasets=Array.isArray(state.datasets)?state.datasets:[]; state.settings={autosave:true,...state.settings}; (state.findings||[]).forEach(f=>{f.description=f.description||f.summary||'';f.affectedItems=f.affectedItems||f.affected||[];f.signature=f.signature||SeoGrowUtils.signature(f.projectId,f.type,f.source,(f.affectedItems||[])[0]);}); } if(version < 3){ state.backupMeta={lastRestoreAt:null,lastBackupAt:null}; state.settings={autosave:true,storage:'indexeddb',...state.settings}; } state.schemaVersion=SeoGrow.SCHEMA_VERSION;state.appVersion=SeoGrow.VERSION; return state; };
</script><script>SeoGrowCore.Storage = class { constructor(key='seogrow:state'){this.key=key;this.dbName='seogrow';this.storeName='state'} async db(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB non disponibile'));const request=indexedDB.open(this.dbName,1);request.onupgradeneeded=()=>request.result.createObjectStore(this.storeName);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})} async load(){try{const db=await this.db();return await new Promise((resolve,reject)=>{const r=db.transaction(this.storeName,'readonly').objectStore(this.storeName).get(this.key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(error){const raw=localStorage.getItem(this.key);return raw?JSON.parse(raw):null}} async save(state){try{const db=await this.db();await new Promise((resolve,reject)=>{const r=db.transaction(this.storeName,'readwrite').objectStore(this.storeName).put(state,this.key);r.onsuccess=resolve;r.onerror=()=>reject(r.error)});localStorage.setItem(`${this.key}:meta`,JSON.stringify({schemaVersion:state.schemaVersion,updatedAt:SeoGrowUtils.now()}))}catch(error){localStorage.setItem(this.key,JSON.stringify(state));return 'fallback'}} backup(state){return JSON.stringify({appVersion:SeoGrow.VERSION,schemaVersion:SeoGrow.SCHEMA_VERSION,exportedAt:SeoGrowUtils.now(),...state},null,2)} validateBackup(text){let data;try{data=JSON.parse(text)}catch{throw new Error('Il backup non è JSON valido')}if(!data||!Array.isArray(data.projects)||!Array.isArray(data.findings)||!Array.isArray(data.tasks))throw new Error('Il backup non contiene una struttura seoGrow valida');if(Number(data.schemaVersion)>SeoGrow.SCHEMA_VERSION)throw new Error('Backup creato da una versione più recente');return SeoGrowCore.migrate(data)} };
</script><script>SeoGrowCore.Store = class { constructor(initial,bus,logger){this.state=SeoGrowUtils.clone(initial);this.bus=bus;this.logger=logger} getState(){return SeoGrowUtils.clone(this.state)} select(fn){return fn(this.state)} dispatch(action){const s=SeoGrowUtils.clone(this.state); const at=SeoGrowUtils.now(); switch(action.type){
case 'PROJECT_CREATED':s.projects.push(action.project);s.activeProjectId=action.project.id;break; case 'PROJECT_SELECTED':s.activeProjectId=action.id;break;
case 'CONNECTION_UPDATED':s.settings={...s.settings,connections:{...(s.settings.connections||{}),[action.connection]:action.value}};break;
case 'DATASET_IMPORTED':s.datasets.push(action.dataset);break; case 'FINDING_UPSERTED':{const i=s.findings.findIndex(x=>x.signature===action.finding.signature);if(i>-1)s.findings[i]={...s.findings[i],...action.finding,updatedAt:at};else s.findings.push(action.finding);break;}
case 'FINDING_STATUS':{const f=s.findings.find(x=>x.id===action.id);if(!f)throw new Error('Finding inesistente');this.transition('finding',f.status,action.status);f.status=action.status;f.updatedAt=at;break;}
case 'TASK_CREATED':s.tasks.push(action.task);break; case 'TASK_STATUS':{const t=s.tasks.find(x=>x.id===action.id);if(!t)throw new Error('Task inesistente');this.transition('task',t.status,action.status);t.status=action.status;t.updatedAt=at;break;} default:throw new Error(`Azione non supportata: ${action.type}`)}
s.history.push({id:SeoGrowUtils.id('history'),projectId:action.projectId||s.activeProjectId,entityType:action.entityType||action.type.split('_')[0].toLowerCase(),entityId:action.entityId||action.id||action.project?.id||action.dataset?.id||action.finding?.id||action.task?.id,action:action.type,timestamp:at,metadata:action.metadata||{}}); this.state=s;this.bus.emit('state:changed',{action,state:this.getState()});return this.getState() }
  transition(kind,from,to){if(!(SeoGrow.TRANSITIONS[kind][from]||[]).includes(to))throw new Error(`Transizione ${kind} non valida: ${from} → ${to}`)} replace(next,meta={}){this.state=SeoGrowUtils.clone(next);this.bus.emit('state:changed',{action:{type:'STATE_RESTORED',...meta},state:this.getState()});return this.getState()} };
</script><script>window.SeoGrowServices = window.SeoGrowServices || {};
SeoGrowServices.FindingService = class { constructor(store,bus){this.store=store;this.bus=bus} create(candidate){const now=SeoGrowUtils.now();const f={id:SeoGrowUtils.id('finding'),projectId:candidate.projectId,type:candidate.type,title:candidate.title,description:candidate.description||'',status:'candidate',severity:candidate.severity||'medium',impact:candidate.impact||'medium',confidence:Number(candidate.confidence||0),evidence:candidate.evidence||[],affectedItems:candidate.affectedItems||[],source:candidate.source||'UNKNOWN',signature:candidate.signature,createdAt:now,updatedAt:now};this.store.dispatch({type:'FINDING_UPSERTED',finding:f,projectId:f.projectId});this.bus.emit('finding:created',f);return f} status(id,status){const f=this.store.select(s=>s.findings.find(x=>x.id===id));this.store.dispatch({type:'FINDING_STATUS',id,status,projectId:f?.projectId,entityId:id});this.bus.emit(`finding:${status}`,{id});} };
</script><script>SeoGrowServices.TaskService = class { constructor(store,bus){this.store=store;this.bus=bus} create(findingId){const f=this.store.select(s=>s.findings.find(x=>x.id===findingId));if(!f)throw new Error('Finding inesistente');if(f.status!=='validated')throw new Error('Valida il finding prima di creare una task');const duplicate=this.store.select(s=>s.tasks.find(t=>t.findingId===findingId&&!['archived','obsolete'].includes(t.status)));if(duplicate)return duplicate;const task={id:SeoGrowUtils.id('task'),projectId:f.projectId,findingId,title:f.title,description:f.description,type:f.type,priority:f.severity==='high'?'Alta':f.severity==='low'?'Bassa':'Media',status:'todo',createdAt:SeoGrowUtils.now()};this.store.dispatch({type:'TASK_CREATED',task,projectId:f.projectId});this.store.dispatch({type:'FINDING_STATUS',id:f.id,status:'task_created',projectId:f.projectId});this.bus.emit('task:created',task);return task} status(id,status){const t=this.store.select(s=>s.tasks.find(x=>x.id===id));this.store.dispatch({type:'TASK_STATUS',id,status,projectId:t?.projectId,entityId:id});this.bus.emit(`task:${status}`,{id});} };
</script><script>window.SeoGrowTechnical = window.SeoGrowTechnical || {};
SeoGrowTechnical.parseLinks = text => { const cleaned=String(text||'').replace(/^\uFEFF/,'').trim(); if(!cleaned) return []; if(cleaned.startsWith('[')){const data=JSON.parse(cleaned);if(!Array.isArray(data))throw new Error('Il JSON deve contenere un array');return data.map(x=>({source:String(x.source||'').trim(),target:String(x.target||'').trim(),status:Number(x.status)}));} const lines=cleaned.split(/\r?\n/).filter(Boolean);const separator=lines[0].includes(';')?';':',';const headers=lines.shift().split(separator).map(x=>x.trim().toLowerCase());const at=n=>headers.indexOf(n);if([at('source'),at('target'),at('status')].some(i=>i<0))throw new Error('CSV non valido: servono le colonne source, target, status');return lines.map(line=>{const c=line.split(separator).map(x=>x.trim().replace(/^"|"$/g,''));return {source:c[at('source')],target:c[at('target')],status:Number(c[at('status')])};}); };
SeoGrowTechnical.validateLinks = records => {const valid=[],invalid=[];records.forEach((r,index)=>{if(!SeoGrowUtils.safeUrl(r.source)||!SeoGrowUtils.safeUrl(r.target)||!Number.isInteger(r.status))invalid.push({index:index+1,reason:'URL o stato HTTP non valido'});else valid.push({...r,source:SeoGrowUtils.safeUrl(r.source),target:SeoGrowUtils.safeUrl(r.target)});});return {valid,invalid};};
SeoGrowTechnical.analyzeBrokenLinks = (projectId, records) => records.filter(r=>[404,410].includes(r.status)).map(r=>({projectId,type:'broken_internal_link',title:'Link interno rotto confermato',description:`${r.source} punta a ${r.target} e restituisce HTTP ${r.status}.`,severity:'high',impact:'high',confidence:100,source:'IMPORTED',affectedItems:[r.source,r.target],evidence:[{type:'http_status',source:'IMPORTED',value:r.status,reliability:'CONFIRMED',timestamp:SeoGrowUtils.now(),note:`Origine: ${r.source}`}],signature:SeoGrowUtils.signature(projectId,'broken_internal_link',r.source,r.target,r.status)}));
</script><script>window.SeoGrowSearchConsole = window.SeoGrowSearchConsole || {};
SeoGrowSearchConsole.parse = text => {const lines=String(text||'').replace(/^\uFEFF/,'').trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)throw new Error('Il CSV Search Console non contiene record');const sep=lines[0].includes(';')?';':',';const header=lines.shift().split(sep).map(x=>x.trim().toLowerCase());const index=(...names)=>header.findIndex(x=>names.includes(x));const q=index('query','query principale'),url=index('page','pagina','url'),clicks=index('clicks','clic'),impressions=index('impressions','impressioni'),position=index('position','posizione');if([q,url,clicks,impressions,position].some(x=>x<0))throw new Error('CSV non supportato: servono Query, Page, Clicks, Impressions e Position');return lines.map(line=>{const c=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));return {query:c[q],url:c[url],clicks:Number(c[clicks]),impressions:Number(c[impressions]),position:Number(String(c[position]).replace(',','.'))}}).filter(r=>r.query&&SeoGrowUtils.safeUrl(r.url)&&Number.isFinite(r.impressions));};
SeoGrowSearchConsole.cannibalization = (projectId,rows) => {const byQuery=new Map();rows.forEach(r=>{const k=r.query.toLowerCase().trim();if(!byQuery.has(k))byQuery.set(k,[]);byQuery.get(k).push({...r,url:SeoGrowUtils.safeUrl(r.url)})});return [...byQuery].flatMap(([query,list])=>{const pages=[...new Map(list.map(r=>[r.url,r])).values()].sort((a,b)=>b.impressions-a.impressions||a.url.localeCompare(b.url));const total=pages.reduce((n,r)=>n+r.impressions,0);if(pages.length<2||total<20||pages[1].impressions<5||pages[1].impressions/total<.12)return [];return [{projectId,type:'cannibalization',title:`Possibile cannibalizzazione: ${query}`,description:`${pages.length} URL hanno ricevuto impressioni per la stessa query. Verifica l'intento prima di intervenire.`,severity:'medium',impact:'medium',confidence:85,source:'IMPORTED',affectedItems:pages.map(x=>x.url),evidence:pages.map(x=>({type:'gsc_page_query',source:'IMPORTED',value:{url:x.url,impressions:x.impressions,clicks:x.clicks,position:x.position},reliability:'HIGH',timestamp:SeoGrowUtils.now()})),signature:SeoGrowUtils.signature(projectId,'cannibalization',query,pages.map(x=>x.url).join(','))}]});};
</script><script>window.SeoGrowSearchConsoleBundle=window.SeoGrowSearchConsoleBundle||{};
SeoGrowSearchConsoleBundle.csv=function(text){var lines=String(text||'').replace(/^\uFEFF/,'').trim().split(/\r?\n/).filter(Boolean);if(!lines.length)return {headers:[],rows:[]};var sep=lines[0].indexOf(';')>-1?';':',';var headers=lines.shift().split(sep).map(function(x){return x.trim()});return {headers:headers,rows:lines.map(function(line){var c=line.split(sep);var row={};headers.forEach(function(h,i){row[h]=String(c[i]||'').trim().replace(/^"|"$/g,'')});return row})};};
SeoGrowSearchConsoleBundle.kind=function(headers){var h=headers.map(function(x){return x.toLowerCase()}).join('|');if(h.indexOf('query')>-1)return 'queries';if(h.indexOf('pagine principali')>-1||h.indexOf('page')>-1)return 'pages';if(h.indexOf('paese')>-1)return 'countries';if(h.indexOf('dispositivo')>-1)return 'devices';if(h.indexOf('aspetto nella ricerca')>-1)return 'searchAppearance';if(h.indexOf('filtra')>-1)return 'filters';if(h.indexOf('data')>-1)return 'chart';return 'unknown'};

SeoGrowSearchConsoleBundle.readFiles=async function(files){var out=[];for(var i=0;i<files.length;i++){var file=files[i];if(/\.zip$/i.test(file.name))out=out.concat(await SeoGrowSearchConsoleBundle.readZip(await file.arrayBuffer()));else out.push({name:file.name,text:await file.text()})}return out};

</script><script>(function(){var proto=SeoGrowUI.App.prototype,oldClick=proto.click,oldGsc=proto.gsc;proto.importGscBundle=async function(){var input=document.getElementById('gscFiles'),files=input&&input.files;if(!files||!files.length)throw Error('Seleziona uno o più CSV oppure lo ZIP di Search Console');var groups=await SeoGrowSearchConsoleBundle.importBundle(files),project=this.app.store.select(function(s){return s.activeProjectId}),imported=[];Object.keys(groups).forEach(function(kind){if(kind==='unknown'||kind==='filters'||!groups[kind].length)return;this.dataset(project,'search-console-'+kind,groups[kind].length,0);imported.push(kind+' ('+groups[kind].length+')')},this);if(!imported.length)throw Error('Nessun report Search Console riconosciuto');this.notify('Importati dati reali: '+imported.join(', ')+'. Le cannibalizzazioni richiedono un export Query + Pagina combinato oppure l’API Search Console.')} ;proto.click=async function(e){var el=e.target.closest('[data-action]');if(el&&el.dataset.action==='import-gsc-bundle'){try{await this.importGscBundle()}catch(error){this.notify(error.message,'error')}return}return oldClick.call(this,e)};proto.gsc=function(){return `<h1>Importa export Search Console</h1><p class="muted">Seleziona tutti i CSV esportati insieme oppure direttamente lo ZIP. seoGrow riconosce automaticamente Query, Pagine, Paesi, Dispositivi, Aspetto nella ricerca, Filtri e Grafico.</p><section class="card"><label for="gscFiles">File Search Console</label><input id="gscFiles" type="file" accept=".csv,.zip,text/csv,application/zip" multiple><p><small>Puoi scegliere più file CSV in una volta sola oppure lo ZIP scaricato da Search Console. I dati restano separati e datati per tipo di report.</small></p><button class="primary" data-action="import-gsc-bundle">Importa tutti i dati</button></section><section class="card"><h2>Analisi affidabili disponibili</h2><p>Query e pagine sono importate separatamente. Per dimostrare una cannibalizzazione servono dati Query + Pagina nella stessa esportazione o il collegamento diretto all’API Search Console.</p></section>`};})();
</script><script>window.SeoGrowApp = class { constructor(){this.bus=new SeoGrowCore.EventBus();this.logger=new SeoGrowCore.Logger();this.storage=new SeoGrowCore.Storage();this.wordpress=null;this.initial={appVersion:SeoGrow.VERSION,schemaVersion:SeoGrow.SCHEMA_VERSION,activeProjectId:null,projects:[],datasets:[],findings:[],tasks:[],history:[],backupMeta:{lastRestoreAt:null,lastBackupAt:null},settings:{autosave:true,storage:'indexeddb',connections:{}}}} async start(){try{const saved=await this.storage.load();this.store=new SeoGrowCore.Store(SeoGrowCore.migrate(saved||this.initial),this.bus,this.logger)}catch(error){this.recovery=error;this.store=new SeoGrowCore.Store(this.initial,this.bus,this.logger)}this.findings=new SeoGrowServices.FindingService(this.store,this.bus);this.tasks=new SeoGrowServices.TaskService(this.store,this.bus);this.bus.on('state:changed',({state})=>{this.storage.save(state).then(()=>this.bus.emit('storage:saved')).catch(error=>{this.logger.error('storage','save',{error:error.message});this.bus.emit('storage:error',{error})})});if(!this.store.select(s=>s.projects.length))this.createProject('esempio.it');this.ui=new SeoGrowUI.App(this);this.ui.mount(document.getElementById('app'));if(this.recovery)this.ui.notify('Dati precedenti non leggibili: avviata modalità di recupero senza sovrascrivere il backup.','error')} createProject(domain){let url;try{url=new URL(/^https?:/i.test(domain)?domain:`https://${domain}`)}catch{throw new Error('Dominio non valido')}const project={id:SeoGrowUtils.id('prj'),domain:url.hostname.replace(/^www\./,''),name:url.hostname,createdAt:SeoGrowUtils.now()};this.store.dispatch({type:'PROJECT_CREATED',project})} async connectWordPress(){const project=this.store.select(s=>s.projects.find(x=>x.id===s.activeProjectId));const site=prompt('URL completo del sito WordPress',`https://${project.domain}`);if(!site)throw Error('Connessione annullata');const username=prompt('Nome utente WordPress autorizzato');if(!username)throw Error('Connessione annullata');const password=prompt('Password applicazione WordPress');if(!password)throw Error('Connessione annullata');const base=site.replace(/\/$/,'');const auth='Basic '+btoa(`${username}:${password.replace(/\s/g,'')}`);const res=await fetch(`${base}/wp-json/seogrow/v1/capabilities`,{headers:{Authorization:auth}});if(!res.ok)throw Error(`Connessione WordPress non riuscita (HTTP ${res.status}). Verifica plugin, URL e Password applicazione.`);this.wordpress={base,auth};this.store.dispatch({type:'CONNECTION_UPDATED',connection:'wordpress',value:{base,connectedAt:SeoGrowUtils.now(),capabilities:await res.json()}});return this.wordpress} async importWordPressPages(){if(!this.wordpress)await this.connectWordPress();const res=await fetch(`${this.wordpress.base}/wp-json/seogrow/v1/pages?per_page=100`,{headers:{Authorization:this.wordpress.auth}});if(!res.ok)throw Error(`Lettura pagine non riuscita (HTTP ${res.status})`);const payload=await res.json(),rows=(payload.rows||[]).map(r=>({url:r.url,title:r.title||'',meta:r.metaDescription||'',h1:r.h1||'',canonical:r.canonical||'',indexability:r.indexability||'unknown'}));if(!rows.length)throw Error('Il connettore non ha restituito pagine pubblicate');const p=this.store.select(s=>s.activeProjectId);this.store.dispatch({type:'DATASET_IMPORTED',dataset:{id:SeoGrowUtils.id('dataset'),projectId:p,type:'pages-onpage',source:'WORDPRESS_CONNECTOR',importedAt:SeoGrowUtils.now(),records:rows.length,invalid:0}});SeoGrowPages.analyze(p,rows).forEach(x=>this.findings.create(x));return {records:rows.length};} async restore(text){const next=this.storage.validateBackup(text);const current=this.store.getState();await this.storage.save(current);next.backupMeta={...(next.backupMeta||{}),lastRestoreAt:SeoGrowUtils.now()};this.store.replace(next,{source:'backup:restore'});await this.storage.save(next);return next} };document.addEventListener('DOMContentLoaded',()=>new SeoGrowApp().start());
